<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>鹈鹕单车 · Pelican Express</title>
<style>
/* ============================================================
   鹈鹕单车 — 界面样式（玻璃拟态，全部由 CSS 绘制，无图片 / 无 SVG）
   ============================================================ */
:root{
  --glass: rgba(9,15,19,.40);
  --glass-2: rgba(9,15,19,.66);
  --line: rgba(255,255,255,.14);
  --line-2: rgba(255,255,255,.08);
  --txt: #eef5f3;
  --dim: #a3b4b1;
  --mint: #7fe6c6;
  --mint-d: #2f8f79;
  --warm: #ffcf8a;
  --r: 16px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; overflow:hidden; background:#0d1518; }
body{
  font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
canvas{ display:block; }
#ui{ position:fixed; inset:0; pointer-events:none; z-index:10; }
#ui.hidden{ opacity:0; transition:opacity .35s ease; }
#ui > *{ pointer-events:auto; }

/* ---- 卡片通用 ---- */
.card{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:var(--r);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 18px 46px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.10);
}

/* ---- 左上：标题 ---- */
#title{ position:absolute; left:22px; top:20px; padding:13px 17px 12px; }
#title h1{
  margin:0; font-size:17px; font-weight:650; letter-spacing:.055em;
  display:flex; align-items:center; gap:9px;
}
#title h1 i{
  width:9px; height:9px; border-radius:50%; background:var(--mint);
  box-shadow:0 0 0 3px rgba(127,230,198,.18), 0 0 14px var(--mint); font-style:normal;
}
#title p{ margin:5px 0 0 18px; font-size:10.5px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }

/* ---- 右上：仪表 ---- */
#gauge{ position:absolute; right:22px; top:20px; padding:12px 16px; min-width:158px; }
#gauge .row{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
#gauge .num{ font-size:30px; font-weight:600; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
#gauge .num small{ font-size:11px; font-weight:500; color:var(--dim); margin-left:4px; letter-spacing:.08em; }
#gauge .lbl{ font-size:9.5px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; margin-top:8px; }
#bar{ margin-top:7px; height:3px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
#bar i{ display:block; height:100%; width:0%; border-radius:2px;
  background:linear-gradient(90deg,var(--mint),var(--warm)); transition:width .12s linear; }
#sub{ margin-top:9px; display:flex; gap:12px; font-size:10px; color:var(--dim); letter-spacing:.04em; }
#sub b{ color:var(--txt); font-weight:600; font-variant-numeric:tabular-nums; }

/* ---- 底部：控制台 ---- */
#dock{
  position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px; padding:10px 14px;
}
.seg{ display:flex; gap:3px; padding:3px; border-radius:11px; background:rgba(255,255,255,.06); border:1px solid var(--line-2); }
.btn{
  appearance:none; border:0; background:transparent; color:var(--dim);
  font:inherit; font-size:11.5px; letter-spacing:.06em; font-weight:500;
  padding:7px 11px; border-radius:8px; cursor:pointer; white-space:nowrap;
  transition:background .18s ease,color .18s ease;
}
.btn:hover{ color:var(--txt); background:rgba(255,255,255,.07); }
.btn.on{ background:rgba(127,230,198,.16); color:var(--mint); box-shadow:inset 0 0 0 1px rgba(127,230,198,.28); }
.btn.warm.on{ background:rgba(255,207,138,.16); color:var(--warm); box-shadow:inset 0 0 0 1px rgba(255,207,138,.28); }
.sep{ width:1px; height:26px; background:var(--line-2); }
#speedWrap{ display:flex; align-items:center; gap:9px; padding-left:2px; }
#speedWrap span{ font-size:9.5px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
input[type=range]{
  -webkit-appearance:none; appearance:none; width:132px; height:3px; border-radius:2px;
  background:linear-gradient(90deg,var(--mint) var(--p,40%), rgba(255,255,255,.14) var(--p,40%));
  outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:#fff; border:2px solid var(--mint-d); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%; background:#fff; border:2px solid var(--mint-d); cursor:grab;
}

/* ---- 左下：快捷键 ---- */
#hints{ position:absolute; left:22px; bottom:24px; padding:11px 14px; font-size:10.5px; color:var(--dim); line-height:1.85; }
#hints b{
  color:var(--txt); font-weight:500; display:inline-block; min-width:16px; text-align:center;
  padding:1px 5px; margin-right:7px; border-radius:5px; font-size:9.5px;
  background:rgba(255,255,255,.09); border:1px solid var(--line-2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ---- 鹈鹕气泡 ---- */
#bubble{
  position:absolute; left:0; top:0; max-width:216px; padding:10px 13px;
  font-size:12px; line-height:1.5; color:var(--txt); opacity:0;
  transform:translate(-50%,-118%) scale(.9); transform-origin:50% 100%;
  transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.3,.4,1);
  background:var(--glass-2); border:1px solid var(--line); border-radius:13px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 40px rgba(0,0,0,.36);
}
#bubble.show{ opacity:1; transform:translate(-50%,-128%) scale(1); }
#bubble::after{
  content:""; position:absolute; left:50%; bottom:-5px; width:9px; height:9px; margin-left:-4.5px;
  background:var(--glass-2); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  transform:rotate(45deg);
}
#bubble b{ color:var(--mint); font-weight:600; }

/* ---- 载入 ---- */
#load{
  position:fixed; inset:0; z-index:50; display:grid; place-items:center; gap:0;
  background:radial-gradient(900px 620px at 50% 38%, #1c2f33, #0b1114 72%);
  transition:opacity .7s ease;
}
#load.gone{ opacity:0; pointer-events:none; }
#load .wrap{ text-align:center; }
#load .r1{ width:44px; height:44px; margin:0 auto 20px; border-radius:50%;
  border:2px solid rgba(255,255,255,.12); border-top-color:var(--mint); animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
#load p{ margin:0; font-size:12px; letter-spacing:.3em; color:var(--dim); text-transform:uppercase; }
#load small{ display:block; margin-top:14px; font-size:10.5px; color:#5f716f; max-width:320px; line-height:1.7; }

@media (max-width:860px){
  #hints{ display:none; }
  #title p{ display:none; }
  #dock{ flex-wrap:wrap; justify-content:center; max-width:94vw; bottom:14px; }
  #gauge{ min-width:0; padding:10px 12px; }
  #gauge .num{ font-size:24px; }
}
</style>
</head>

<script type="module">
/* —— three.js：主 CDN + 备用 CDN，任一可用即可 —— */
let THREE = null;
for (const url of ['three',
                   'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
                   'https://esm.sh/three@0.169.0']){
  try { THREE = await import(url); break; } catch (e) { /* 继续尝试下一个 */ }
}
if (!THREE || !THREE.WebGLRenderer){
  const m = document.getElementById('loadMsg');
  if (m) m.innerHTML = '无法加载 three.js 模块<br>请检查网络后刷新页面';
  throw new Error('three.js unavailable');
}

const _LOGS = [];
for (const k of ['error','warn']){
  const o = console[k].bind(console);
  console[k] = (...a)=>{ _LOGS.push(k+': '+a.map(x=>{ try{ return (x&&x.stack)?x.stack:String(x); }catch(e){ return String(x); } }).join(' ')); o(...a); };
}
const dumpLogs = ()=>{ const p=document.createElement('pre'); p.id='dbg'; p.textContent=_LOGS.join('\n').slice(0,6000); document.body.appendChild(p); };
addEventListener('error', (e)=>{ document.title = 'ERR ' + (e.message||'') + ' @' + (e.lineno||'?'); _LOGS.push('onerror '+e.message+' '+(e.error&&e.error.stack||'')); });
addEventListener('unhandledrejection', (e)=>{ document.title = 'REJ ' + e.reason; });

/* ============================================================
   鹈鹕单车 —— 全部几何体、动画、材质均由代码实时生成
   ============================================================ */

const QS      = new URLSearchParams(location.search);
const SHOT    = QS.has('shot');            // 供无头截图校验使用
const SHOT_SIM = parseFloat(QS.get('sim') || '3.2');

const clamp  = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp   = (a,b,t)=> a+(b-a)*t;
const smooth = (e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const damp   = (a,b,l,dt)=> lerp(a,b,1-Math.exp(-l*dt));
const TAU    = Math.PI*2;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry32(20240917);
const rr  = (a,b)=> a+(b-a)*rnd();

/* ---------- 关键尺寸（单位：米） ---------- */
const K = {
  wheelR   : 0.340,   // 外胎接地半径
  tireT    : 0.034,
  rimR     : 0.298,
  rear     : new THREE.Vector3(0, 0.340, -0.520),
  front    : new THREE.Vector3(0, 0.340,  0.520),
  bb       : new THREE.Vector3(0, 0.276, -0.100),  // 五通/曲柄中心
  crank    : 0.168,     // 曲柄长
  gear     : 2.90,      // 齿比（车轮转速 / 曲柄转速）
  seatTop  : new THREE.Vector3(0, 0.855, -0.228),
  headTop  : new THREE.Vector3(0, 0.800,  0.392),
  headBot  : new THREE.Vector3(0, 0.628,  0.452),
  barC     : new THREE.Vector3(0, 0.952,  0.352),
  grip     : new THREE.Vector3(0.216, 0.940, 0.402),
  pedalX   : 0.104,
  bodyY    : 1.070,     // 鹈鹕躯干中心高度
  pelZ     : -0.080,
  thigh    : 0.490,
  shank    : 0.470,
  upperArm : 0.265,
  foreArm  : 0.255,
};

/* ============================================================
   1. 渲染器 / 场景 / 灯光
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.08, 900);
camera.position.set(2.9, 1.75, -3.3);

/* —— 两套灯光预设，可平滑过渡 —— */
const PRESET = {
  day:  { sun:[0xfff0d8,2.55, 5.6,9.0,-3.6], hemi:[0xbfdcf5,0x6a7a4e,0.62], rim:[0xbcd8ff,0.45],
          fog:[0xbfd8e2,26,100], sky:[0x7fb6e8,0xdcecf2,0.95], sunCol:0xfff3d0, exp:1.02 },
  dusk: { sun:[0xffb070,3.30, 7.8,3.9,-5.2], hemi:[0x9ab8e8,0x4a4232,0.95], rim:[0xffc9a0,0.60],
          fog:[0xbcc2c4,24,98], sky:[0x1e2c5c,0xf2b47e,1.00], sunCol:0xffd39a, exp:1.04 },
};
let lightBlend = 0;                                   // 0 = day, 1 = dusk

const sun = new THREE.DirectionalLight(0xfff0d8, 2.5);
sun.position.set(5.6, 9.0, -3.6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near = 1.5; sun.shadow.camera.far = 30;
sun.shadow.camera.left=-4.8; sun.shadow.camera.right=4.8;
sun.shadow.camera.top=4.8;   sun.shadow.camera.bottom=-4.8;
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.022;
scene.add(sun); scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbfdcf5, 0x6a7a4e, 0.62); scene.add(hemi);
const rim  = new THREE.DirectionalLight(0xbcd8ff, 0.45); rim.position.set(-4.5, 3.0, 5.5); scene.add(rim);

scene.fog = new THREE.Fog(0xbfd8e2, 34, 205);

/* ============================================================
   2. 程序化地形（高度函数 GLSL 与 JS 完全一致）
   ============================================================ */
const GLSL_TERRAIN = `
  float terrainH(vec2 p){
    float m = smoothstep(2.85, 10.0, abs(p.x));
    float h = 0.0;
    h += sin(p.x*0.090 + p.y*0.050)*1.90;
    h += sin(p.x*0.031 - p.y*0.043)*2.60;
    h += sin(p.y*0.021 + p.x*0.017)*3.20;
    h += sin(p.x*0.130 - p.y*0.110)*0.55;
    h += sin(p.y*0.071 + p.x*0.023)*0.90;
    return h*m*0.28;
  }`;
const GLSL_NOISE = `
  float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float vnoise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    float a=hash21(i), b=hash21(i+vec2(1.,0.)), c=hash21(i+vec2(0.,1.)), d=hash21(i+vec2(1.,1.));
    return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
  }
  float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<3;i++){ v+=a*vnoise(p); p*=2.07; a*=0.5; } return v; }`;

function terrainH(x,z){
  const m = smooth(2.85, 10.0, Math.abs(x));
  let h = 0;
  h += Math.sin(x*0.090 + z*0.050)*1.90;
  h += Math.sin(x*0.031 - z*0.043)*2.60;
  h += Math.sin(z*0.021 + x*0.017)*3.20;
  h += Math.sin(x*0.130 - z*0.110)*0.55;
  h += Math.sin(z*0.071 + x*0.023)*0.90;
  return h*m*0.28;
}

/* ============================================================
   3. 材质库
   ============================================================ */
const M = {
  frame   : new THREE.MeshStandardMaterial({ color:0x1f9e93, metalness:0.28, roughness:0.30 }),
  frame2  : new THREE.MeshStandardMaterial({ color:0xf2efe2, metalness:0.10, roughness:0.42 }),
  chrome  : new THREE.MeshStandardMaterial({ color:0xc9d0d8, metalness:0.88, roughness:0.26 }),
  dark    : new THREE.MeshStandardMaterial({ color:0x23272d, metalness:0.35, roughness:0.48 }),
  rubber  : new THREE.MeshStandardMaterial({ color:0x191c21, metalness:0.0,  roughness:0.92 }),
  leather : new THREE.MeshStandardMaterial({ color:0x8a5636, metalness:0.0,  roughness:0.66 }),
  wood    : new THREE.MeshStandardMaterial({ color:0xc99a5e, metalness:0.0,  roughness:0.55 }),
  feather : new THREE.MeshStandardMaterial({ color:0xfaf7ef, roughness:0.86, metalness:0.0 }),
  feather2: new THREE.MeshStandardMaterial({ color:0xdedacd, roughness:0.88, metalness:0.0 }),
  tip     : new THREE.MeshStandardMaterial({ color:0x7d7360, roughness:0.80, metalness:0.0 }),
  beak    : new THREE.MeshStandardMaterial({ color:0xf6c95f, roughness:0.42, metalness:0.0,
                                            vertexColors:true, flatShading:false, side:THREE.DoubleSide }),
  pouch   : new THREE.MeshStandardMaterial({ color:0xf3a03f, roughness:0.46, metalness:0.0,
                                            vertexColors:true, side:THREE.DoubleSide }),
  beakDk  : new THREE.MeshStandardMaterial({ color:0x8a6a38, roughness:0.45 }),
  leg     : new THREE.MeshStandardMaterial({ color:0xc98a72, roughness:0.66 }),
  legDk   : new THREE.MeshStandardMaterial({ color:0xa96f5c, roughness:0.70 }),
  eyeW    : new THREE.MeshStandardMaterial({ color:0xf6dc8c, roughness:0.22 }),
  eyeB    : new THREE.MeshStandardMaterial({ color:0x120f0c, roughness:0.12 }),
  gloss   : new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.05 }),
};

/* ============================================================
   4. 通用几何工具
   ============================================================ */
const V3 = (x,y,z)=> new THREE.Vector3(x,y,z);
const UPV = V3(0,1,0);
const _q = new THREE.Quaternion(), _v = new THREE.Vector3();

/** 把一根沿 +Y 的圆柱摆放到 a→b 之间（可锥形） */
function placeBone(mesh, a, b, r0, r1){
  _v.subVectors(b,a);
  const len = _v.length() || 1e-4;
  mesh.position.copy(a).addScaledVector(_v, 0.5);
  mesh.quaternion.setFromUnitVectors(UPV, _v.divideScalar(len));
  mesh.scale.set(1, len, 1);
  if (r0 !== undefined && mesh.userData.r0 !== r0){
    const g = new THREE.CylinderGeometry(r1, r0, 1, 12, 1, false);
    mesh.geometry = g; mesh.userData.r0 = r0;
  }
  return mesh;
}
function boneMesh(r0, r1, mat, seg=12){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, 1, seg, 1, false), mat);
  m.userData.r0 = r0; m.castShadow = true;
  return m;
}
/** 两骨 IK：返回中间关节（肘/膝）的位置 */
function ikJoint(root, target, L1, L2, pole, out){
  _v.subVectors(target, root);
  let d = _v.length();
  const maxD = (L1+L2)*0.999, minD = Math.abs(L1-L2)+0.001;
  if (d < 1e-5){ d = 1e-5; _v.set(0,-1,0); }
  _v.divideScalar(d);
  d = clamp(d, minD, maxD);
  const a = (L1*L1 - L2*L2 + d*d) / (2*d);
  const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  out.copy(pole).addScaledVector(_v, -pole.dot(_v));
  if (out.lengthSq() < 1e-8) out.set(0,0,1).addScaledVector(_v, -_v.z);
  out.normalize();
  return out.multiplyScalar(h).addScaledVector(_v, a).add(root);
}

/** 参数曲面：可每帧重算的程序化网格（喙、喉囊、脖颈） */
class Loft {
  constructor(nu, nv, fn, mat, closed=true){
    this.nu=nu; this.nv=nv; this.fn=fn;
    const cnt = (nu+1)*(nv+1);
    this.pos = new Float32Array(cnt*3);
    this.uv  = new Float32Array(cnt*2);
    const idx = [];
    for(let i=0;i<nu;i++) for(let j=0;j<nv;j++){
      const a=i*(nv+1)+j, b=a+nv+1, c=b+1, d=a+1;
      idx.push(a,b,d, b,c,d);
    }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('uv', new THREE.BufferAttribute(this.uv,2));
    this.geo.setIndex(idx);
    for(let i=0;i<=nu;i++) for(let j=0;j<=nv;j++){
      const k=(i*(nv+1)+j);
      this.uv[k*2]=i/nu; this.uv[k*2+1]=j/nv;
    }
    this.mesh = new THREE.Mesh(this.geo, mat);
    this.mesh.castShadow = true;
    this.mesh.frustumCulled = false;
    this.update();
  }
  update(){
    const {nu,nv,pos,fn} = this;
    for(let i=0;i<=nu;i++){
      const u=i/nu;
      for(let j=0;j<=nv;j++){
        const k=(i*(nv+1)+j)*3;
        fn(u, j/nv, pos, k);
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.computeVertexNormals();
  }
  /** 顶点色（喙 / 喉囊的渐变） */
  setColor(cfn){
    const cnt = (this.nu+1)*(this.nv+1);
    const col = new Float32Array(cnt*3), c = new THREE.Color();
    for(let i=0;i<=this.nu;i++) for(let j=0;j<=this.nv;j++){
      const k=i*(this.nv+1)+j;
      cfn(i/this.nu, j/this.nv, c);
      col[k*3]=c.r; col[k*3+1]=c.g; col[k*3+2]=c.b;
    }
    this.geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    this.mesh.material.vertexColors = true;
    this.mesh.material.needsUpdate = true;
    return this;
  }
}

/* —— 链条：沿链轮包络解析求解的闭环，逐节推进 —— */
const CHAIN_X = 0.079;
const chainPath = (()=>{
  const C1 = { y:BB.y, z:BB.z }, C2 = { y:K.rear.y, z:K.rear.z };
  const dy = C2.y-C1.y, dz = C2.z-C1.z, L = Math.hypot(dy,dz);
  const ux = dy/L, uz = dz/L;
  const al = Math.acos(clamp((RING_R-COG_R)/L,-1,1));
  const rot = (v,a)=>({ y: v.y*Math.cos(a)-v.z*Math.sin(a), z: v.y*Math.sin(a)+v.z*Math.cos(a) });
  const nP = rot({y:ux,z:uz},  al), nM = rot({y:ux,z:uz}, -al);
  const P1P = {y:C1.y+RING_R*nP.y, z:C1.z+RING_R*nP.z};
  const P2P = {y:C2.y+COG_R *nP.y, z:C2.z+COG_R *nP.z};
  const P1M = {y:C1.y+RING_R*nM.y, z:C1.z+RING_R*nM.z};
  const P2M = {y:C2.y+COG_R *nM.y, z:C2.z+COG_R *nM.z};
  const a1 = RING_R*(TAU-2*al);                       // 牙盘侧长弧
  const a2 = COG_R*(2*al);                            // 飞轮侧短弧
  const l1 = Math.hypot(P2P.y-P1P.y, P2P.z-P1P.z);
  const l3 = Math.hypot(P1M.y-P2M.y, P1M.z-P2M.z);
  const total = l1 + a2 + l3 + a1;
  const angP = Math.atan2(nP.z, nP.y);
  const angM = Math.atan2(nM.z, nM.y);
  return { C1, C2, nP, nM, P1P, P2P, P1M, P2M, a1, a2, l1, l3, total, al, angP, angM };
})();
function chainPoint(s){
  const C = chainPath;
  s = ((s % C.total) + C.total) % C.total;
  let py, pz, ny, nz, ty, tz;
  if (s < C.l1){                                   // 上段：牙盘 → 飞轮
    const t = s/C.l1;
    py = lerp(C.P1P.y, C.P2P.y, t); pz = lerp(C.P1P.z, C.P2P.z, t);
    ny = C.nP.y; nz = C.nP.z;
    ty = C.P2P.y-C.P1P.y; tz = C.P2P.z-C.P1P.z;
  } else if (s < C.l1 + C.a2){                      // 飞轮包角
    const t = (s-C.l1)/C.a2, a = C.angP - 2*C.al*t;
    ny = Math.cos(a); nz = Math.sin(a);
    py = C.C2.y + COG_R*ny; pz = C.C2.z + COG_R*nz;
    ty = nz; tz = -ny;
  } else if (s < C.l1 + C.a2 + C.l3){               // 下段：飞轮 → 牙盘
    const t = (s-C.l1-C.a2)/C.l3;
    py = lerp(C.P2M.y, C.P1M.y, t); pz = lerp(C.P2M.z, C.P1M.z, t);
    ny = C.nM.y; nz = C.nM.z;
    ty = C.P1M.y-C.P2M.y; tz = C.P1M.z-C.P2M.z;
  } else {                                          // 牙盘长弧
    const t = (s-C.l1-C.a2-C.l3)/C.a1, a = C.angM - (C.a1/RING_R)*t;
    ny = Math.cos(a); nz = Math.sin(a);
    py = C.C1.y + RING_R*ny; pz = C.C1.z + RING_R*nz;
    ty = nz; tz = -ny;
  }
  const tl = Math.hypot(ty,tz) || 1;
  return { y:py, z:pz, ny, nz, ty:ty/tl, tz:tz/tl };
}
const CHAIN_N = Math.max(24, Math.round(chainPath.total/0.0258));
const CHAIN_LINK_GEO = new THREE.BoxGeometry(0.0092, 0.0105, chainPath.total/CHAIN_N*0.82);
const chainMesh = new THREE.InstancedMesh(CHAIN_LINK_GEO, M.dark, CHAIN_N);
chainMesh.castShadow = true;
chainMesh.frustumCulled = false;
bike.add(chainMesh);
const _bx = new THREE.Vector3(), _by = new THREE.Vector3(), _bz = new THREE.Vector3(), _bm = new THREE.Matrix4();
function updateChain(dist){
  const step = chainPath.total/CHAIN_N;
  for (let i=0;i<CHAIN_N;i++){
    const c = chainPoint(i*step + dist);
    _by.set(c.ny, 0, c.nz).normalize();
    _bz.set(0, c.ty, c.tz).normalize();
    _bx.crossVectors(_by,_bz).normalize();
    _by.crossVectors(_bz,_bx).normalize();
    _bm.makeBasis(_bx,_by,_bz);
    _bm.setPosition(CHAIN_X, c.y, c.z);

const NECK_NU = 20, NECK_NV = 14;
const nPts=[], nNor=[], nBio=[], nRad=new Float32Array(NECK_NU+1);
const nTmp = V3(0,0,0), nTmp2 = V3(0,0,0);
const neckPts = [V3(0,0.10,0.145), V3(0,0.225,0.235), V3(0,0.40,0.285), V3(0,0.585,0.265)];
const neckCurve = new THREE.CatmullRomCurve3(neckPts, false, 'catmullrom', 0.5);
function updateNeckFrame(){
  for (let i=0;i<=NECK_NU;i++){
    const u = i/NECK_NU;
    neckCurve.getPoint(u, nTmp);
    nPts[i] = nTmp.clone();
    neckCurve.getPoint(Math.min(1,u+0.02), nTmp2);
    const t = nTmp2.sub(nTmp).normalize();
    const ref = V3(1,0,0);
    let n = V3().crossVectors(ref, t);
    if (n.lengthSq() < 1e-6) n.set(0,0,1);
    n.normalize();
    nNor[i] = n;
    nBio[i] = V3().crossVectors(t, n).normalize();
    nRad[i] = 0.083 - 0.034*u + 0.011*Math.sin(Math.PI*Math.pow(u,0.7));
  }
}
updateNeckFrame();
const neckLoft = new Loft(NECK_NU, NECK_NV, (u,v,arr,k)=>{
  const fi = u*NECK_NU, i0 = Math.min(NECK_NU-1, Math.floor(fi)), f = fi-i0;
  const p0 = nPts[i0], p1 = nPts[i0+1], nn = nNor[i0], nb = nBio[i0], nn1 = nNor[i0+1], nb1 = nBio[i0+1];
  const r = lerp(nRad[i0], nRad[i0+1], f) * neckSwell;
  const a = v*TAU, ca = Math.cos(a), sa = Math.sin(a);
  const nx = lerp(nn.x,nn1.x,f)*ca + lerp(nb.x,nb1.x,f)*sa;
  const ny = lerp(nn.y,nn1.y,f)*ca + lerp(nb.y,nb1.y,f)*sa;
  const nz = lerp(nn.z,nn1.z,f)*ca + lerp(nb.z,nb1.z,f)*sa;
  arr[k]   = lerp(p0.x,p1.x,f) + nx*r;
  arr[k+1] = lerp(p0.y,p1.y,f) + ny*r;
  arr[k+2] = lerp(p0.z,p1.z,f) + nz*r;
}, M.feather);

const SPAN = 108;
const uTime = { value: 0 }, uWind = { value: 1 };

function makeField(count, seedFn, layers){
  const items = [];
  for (let i=0;i<count;i++){ const o = {}; seedFn(o,i); o.z = rr(-SPAN/2, SPAN/2); items.push(o); }
  const ims = layers.map(L=>{
    const im = new THREE.InstancedMesh(L.geo, L.mat, count);
    im.castShadow = !!L.shadow; im.receiveShadow = false;
    im.frustumCulled = false;
    if (L.color){
      const col = new THREE.InstancedBufferAttribute(new Float32Array(count*3), 3);
      im.instanceColor = col;
    }
    scene.add(im); return im;
  });
  const field = {
    items, ims,
    paint(){
      const c = new THREE.Color();
      let dirty = false;
      for (let i=0;i<count;i++) for (let m=0;m<ims.length;m++){
        const L = layers[m];
        if (L.color){ L.color(items[i], c); ims[m].instanceColor.setXYZ(i, c.r, c.g, c.b); dirty = true; }
      }
      if (dirty) for (let m=0;m<ims.length;m++) if (ims[m].instanceColor) ims[m].instanceColor.needsUpdate = true;
    },
    update(dist){
      const q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3(), mm = new THREE.Matrix4();
      for (let i=0;i<count;i++){
        const o = items[i];
        o.z -= dist;
        while (o.z < -SPAN*0.5){ o.z += SPAN; seedFn(o,i); }
        o.y = terrainH(o.x, o.z + uDist.value);
        q.setFromEuler(_eu.set(o.rx,o.ry,o.rz));
        v.set(o.x, o.y, o.z); s.set(o.s, o.s, o.s);
        for (let m=0;m<ims.length;m++){ mm.compose(v,q,s); ims[m].setMatrixAt(i, mm); }
      }
      for (let m=0;m<ims.length;m++) ims[m].instanceMatrix.needsUpdate = true;
    }
  };
  field.paint();
  return field;
}

  g.position.set(rr(-70,70), rr(17,34), rr(15,165));
  g.userData.spd = rr(0.25,0.75);
  g.userData.baseY = g.position.y;
  scene.add(g); clouds.push(g);
}

/* —— 轮胎扬尘 —— */
const DUST_N = 140;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N*3), dustLife = new Float32Array(DUST_N), dustSize = new Float32Array(DUST_N);
const dustVel = [];
for (let i=0;i<DUST_N;i++){ dustVel.push(V3(0,0,0)); dustLife[i] = 0; dustPos[i*3+1] = -50; }
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
dustGeo.setAttribute('aLife', new THREE.BufferAttribute(dustLife,1));
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSize,1));
const dustMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ uColor:{ value:new THREE.Color(0xcfc2a8) } },
  vertexShader:`
    attribute float aLife; attribute float aSize; varying float vL;
    void main(){
      vL = aLife;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = aSize * (260.0 / max(0.3,-mv.z)) * (0.4+aLife*0.8);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform vec3 uColor; varying float vL;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.08, d) * vL * 0.42;
      if (a < 0.005) discard;
      gl_FragColor = vec4(uColor, a);
    }`
});
const dustPts = new THREE.Points(dustGeo, dustMat);
dustPts.frustumCulled = false;
scene.add(dustPts);
let dustCursor = 0;
function emitDust(){
  const i = dustCursor; dustCursor = (dustCursor+1)%DUST_N;
  dustPos[i*3]   = rr(-0.05,0.05);
  dustPos[i*3+1] = 0.03;
  dustPos[i*3+2] = K.rear.z + rr(-0.05,0.05);
  dustVel[i].set(rr(-0.5,0.5), rr(0.5,1.5), rr(-1.0,0.3));
  dustLife[i] = 1;
  dustSize[i] = rr(2.2, 5.5);
}

/* ============================================================
   10. 运动学绑定 —— 曲柄 / 脚踏 / 腿 / 身体 / 车轮 / 链条
   ============================================================ */
const headAxis = V3().subVectors(K.headTop, K.headBot).normalize();
const _knee=V3(), _elbow=V3(), _pole=V3(), _tgt=V3(), _ax=V3(), _dir=V3(), _t2=V3();
const _qa=new THREE.Quaternion(), _qb=new THREE.Quaternion(), _qFootB=new THREE.Quaternion();
const _pelInv = new THREE.Quaternion(), _biq = new THREE.Quaternion();
const _qf = new THREE.Quaternion();
const _headW = new THREE.Vector3();

let wheelAngle = 0;

function updateRig(dt){
  const th = ST.theta, ride = ST.ride, sp = ST.speed;

  /* ---- 车架姿态 ---- */
  bike.rotation.z = -0.020*Math.sin(2*th)*ride;
  bike.rotation.x =  0.011*Math.sin(2*th+1.1)*ride;
  bike.rotation.y =  0.014*Math.sin(ST.t*0.63)*Math.min(1, sp/5);
  steer.quaternion.setFromAxisAngle(headAxis, ST.steer);

  /* ---- 轮组 / 传动 ---- */
  wheelAngle += (sp/K.wheelR)*dt;
  rearSpin.rotation.x  =  wheelAngle;
  frontSpin.rotation.x =  wheelAngle;
  cassette.rotation.x  =  wheelAngle;
  ST.chainS += ST.omega*RING_R*dt;
  updateChain(ST.chainS);

  /* ---- 鹈鹕躯干 ---- */
  const bob  = ride*(0.021*Math.cos(2*th) + 0.010*Math.cos(th+0.7));
  const sway = ride*0.010*Math.sin(2*th+0.5);
  const leanF= 0.055 + 0.125*ride + 0.016*Math.sin(th+0.4);
  const drop = (1-ride)*0.118;
  pelican.position.set(sway, K.bodyY + bob - drop, K.pelZ + 0.014*ride*Math.sin(th));
  pelican.rotation.set(leanF + 0.028*ride*Math.cos(2*th+0.8),
                       0.016*Math.sin(th*0.5+1.1)*ride,
                       0.050*Math.sin(2*th+0.4)*ride);
  pelican.updateMatrixWorld(true);

  /* ---- 颈 / 头 ---- */
  const stretch = clamp(ride*0.8 + 0.2 + ST.lookAtCam*0.1, 0, 1.2);
  const hy = -0.45*bob + 0.010*Math.sin(2*th+0.9)*ride + 0.02*(1-ride)*Math.sin(ST.t*0.9);
  const hz = 0.014*Math.sin(th+2.1)*ride;
  neckPts[0].set(0, 0.100, 0.150);
  neckPts[1].set(0, 0.218, 0.240 + 0.032*stretch);
  neckPts[2].set(0, 0.392 + 0.5*hy, 0.292 + 0.052*stretch);
  neckPts[3].set(0, 0.588 + hy, 0.262 + hz);
  neckSwell = 1 + 0.022*Math.sin(2*th+0.5)*ride;
  updateNeckFrame();
  neckLoft.update();

  headG.position.copy(neckPts[3]);
  const gaze = ST.lookAtCam*0.55 + ST.glance*0.42 + Math.sin(ST.t*0.31)*0.05;
  headG.rotation.set(-pelican.rotation.x*0.85 - 0.05 - ST.lookAtCam*0.06 + 0.02*Math.sin(2*th+0.3)*ride,
                     0.13*gaze + 0.05*Math.sin(ST.t*0.44),
                     0.03*Math.sin(th+1.2)*ride - 0.06*gaze);
  // 眨眼
  ST.blink = ST.blink > 0 ? ST.blink - dt*7 : (ST.t > ST.nextBlink ? (ST.nextBlink = ST.t + rr(2.2,6.0), 1) : 0);
  const lidK = 1 - Math.max(0, Math.sin(clamp(ST.blink,0,1)*Math.PI))*0.92;
  for (const e of eyes) e.g.scale.y = lidK;
  // 喙 / 喉囊
  pouchSwell = 1 + 0.035*Math.sin(2*th+1.0)*ride + ST.honk*0.22;
  pouchPiv.rotation.x = -ST.honk*0.62 - 0.02*Math.sin(2*th)*ride;
  pouchLoft.update();

  /* ---- 腿：IK 锁定脚踏 ---- */
  _pelInv.copy(pelican.quaternion).invert();
  for (const leg of legs){
    const ph = leg.s > 0 ? th + Math.PI : th;
    // 脚踏中心（车架空间）
    const px = leg.s*K.pedalX;
    const py = K.bb.y + K.crank*Math.cos(ph);
    const pz = K.bb.z + K.crank*Math.sin(ph);
    _tgt.set(px, py + 0.046, pz);
    // 静止时：右脚撑地，左脚留在脚踏上
    const idle = 1 - ST.ride;
    if (idle > 0.001 && leg.s > 0){
      _t2.set(0.325, 0.040, 0.155);
      _tgt.lerp(_t2, idle);
    }
    // 世界 → 鹈鹕局部
    _tgt.sub(pelican.position).applyQuaternion(_pelInv);

    _ax.subVectors(_tgt, leg.hip).normalize();
    _pole.set(0.05, 0.34, 1).normalize().applyAxisAngle(_ax, -0.34*Math.sin(ph));
    ikJoint(leg.hip, _tgt, leg.L1, leg.L2, _pole, _knee);
    placeBone(leg.thigh, leg.hip, _knee);
    placeBone(leg.shank, _knee, _tgt);
    leg.knee.position.copy(_knee);
    leg.ankle.position.copy(_tgt);
    leg.foot.position.copy(_tgt);
    // 脚掌贴合脚踏：随车架保持水平
    _biq.copy(bike.quaternion);
    _qb.setFromEuler(_eu.set(0.10*Math.sin(ph+1.4), 0, leg.s*0.05, 'YXZ'));
    leg.foot.quaternion.copy(_pelInv).multiply(_biq).multiply(_qb);
  }

  /* ---- 翼：IK 握住车把（招手时脱离） ---- */
  for (const w of wings){
    _tgt.copy(K.grip); _tgt.x = w.s*K.grip.x; _tgt.y = K.grip.y; _tgt.z = K.grip.z;
    if (w.s > 0 && ST.wave > 0.001){
      _t2.set(0.40, 0.44 + 0.05*Math.sin(ST.t*9), 0.34);
      _tgt.lerp(_t2, ST.wave);
    }
    _tgt.sub(pelican.position).applyQuaternion(_pelInv);
    _pole.set(w.s*0.95, -0.20, -0.45).normalize();
    ikJoint(w.shoulder, _tgt, w.L1, w.L2, _pole, _elbow);
    placeBone(w.upper, w.shoulder, _elbow);
    placeBone(w.fore, _elbow, _tgt);
    w.elb.position.copy(_elbow);
    _qa.setFromUnitVectors(UPV, _dir.subVectors(_tgt,_elbow).normalize());
    w.hand.position.copy(_tgt); w.hand.quaternion.copy(_qa);
    // 翼羽贴在前臂上
    _dir.subVectors(_tgt,_elbow).normalize();
    w.featherBank.position.copy(_elbow).addScaledVector(_dir, w.L2*0.40);
    w.featherBank.quaternion.copy(_qa).multiply(_qf.setFromEuler(_eu.set(1.15 + wingFlap*0.5, 0, w.s*0.12)));
    const flap = (w.s>0 ? ST.wave : 0)*Math.sin(ST.t*11)*0.5;
    wingFlap = flap;
  }
}

   11. 相机（电影感轨道 + 手动拖拽）

const CAMS = {
  cine  : { az:2.46, pol:1.430, dist:4.15, tgt:[0,1.20,0.02], fov:40 },
  side  : { az:1.63, pol:1.500, dist:4.30, tgt:[0,1.02,0.00], fov:38 },
  front : { az:0.22, pol:1.490, dist:3.70, tgt:[0,1.06,0.08], fov:40 },
  detail: { az:2.22, pol:1.430, dist:2.55, tgt:[0,0.80,-0.02], fov:34 },
};
const camOrder = ['cine','side','front','detail'];
let camMode = QS.get('cam') && CAMS[QS.get('cam')] ? QS.get('cam') : 'cine';
const cam = { az:CAMS[camMode].az, pol:CAMS[camMode].pol, dist:CAMS[camMode].dist,
              tgt:new THREE.Vector3(...CAMS[camMode].tgt), fov:CAMS[camMode].fov, manual:false };
const _camTgt = new THREE.Vector3();
function updateCamera(dt){
  const m = CAMS[camMode], sn = clamp(ST.speed/ST.maxSpeed, 0, 1);
  if (!cam.manual){
    cam.az    = damp(cam.az,    m.az + Math.sin(ST.t*0.13)*0.11 + ST.steer*1.2, 1.6, dt);
    cam.pol   = damp(cam.pol,   m.pol + Math.sin(ST.t*0.21+1.1)*0.022, 1.6, dt);
    cam.dist  = damp(cam.dist,  m.dist*(1+0.13*sn), 1.8, dt);
    cam.fov   = damp(cam.fov,   m.fov + 5*sn, 1.8, dt);
    _camTgt.set(...m.tgt); _camTgt.y += 0.02*Math.sin(ST.t*0.47)*ST.ride;
    cam.tgt.lerp(_camTgt, 1-Math.exp(-2.4*dt));
  }
  const sp2 = Math.sin(cam.pol);
  _headW.set(
    cam.tgt.x + cam.dist*sp2*Math.sin(cam.az),
    cam.tgt.y + cam.dist*Math.cos(cam.pol),
    cam.tgt.z + cam.dist*sp2*Math.cos(cam.az));
  // 轻微手持抖动
  const amp = 0.004 + 0.012*sn*sn;
  camera.position.copy(_headW);
  camera.position.x += Math.sin(ST.t*7.3)*amp + Math.sin(ST.t*17.1)*amp*0.4;
  camera.position.y += Math.cos(ST.t*6.1)*amp + Math.sin(ST.t*13.7)*amp*0.35;
  camera.lookAt(cam.tgt);
  if (Math.abs(camera.fov - cam.fov) > 0.01){ camera.fov = cam.fov; camera.updateProjectionMatrix(); }
}

function mixHex(a,b,t,out){ out.setHex(a).lerp(_cmix2.setHex(b), t); return out; }

  sun.position.set(lerp(A.sun[2],B.sun[2],t), lerp(A.sun[3],B.sun[3],t), lerp(A.sun[4],B.sun[4],t));
  skyUni.uSunDir.value.copy(sun.position).normalize();
  mixHex(A.hemi[0],B.hemi[0],t, hemi.color);  mixHex(A.hemi[1],B.hemi[1],t, hemi.groundColor);
  hemi.intensity = lerp(A.hemi[2],B.hemi[2],t);
  mixHex(A.rim[0],B.rim[0],t, rim.color);     rim.intensity = lerp(A.rim[1],B.rim[1],t);
  mixHex(A.fog[0],B.fog[0],t, scene.fog.color);
  scene.fog.near = lerp(A.fog[1],B.fog[1],t); scene.fog.far = lerp(A.fog[2],B.fog[2],t);
  mixHex(A.sky[0],B.sky[0],t, skyUni.uTop.value);
  mixHex(A.sky[1],B.sky[1],t, skyUni.uHor.value);
  mixHex(A.sunCol,B.sunCol,t, skyUni.uSun.value);
  mixHex(0xffffff, 0xf0b894, t, cloudMat2.color);
  renderer.toneMappingExposure = lerp(A.exp, B.exp, t);
}

/* ============================================================
   13. 主循环
   ============================================================ */
function update(dt){
  ST.t += dt;

  /* 速度 */
  const tgt = ST.paused ? 0 : ST.target;
  if (keys.has(' ')) ST.speed = damp(ST.speed, 0, 5.0, dt);
  else ST.speed = damp(ST.speed, tgt, tgt > ST.speed ? 0.80 : 1.30, dt);
  ST.speed = Math.max(0, ST.speed);
  ST.dist += ST.speed*dt;
  uDist.value = ST.dist;
  ST.ride = damp(ST.ride, smooth(0.20, 1.70, ST.speed), 4.5, dt);
  const sn = clamp(ST.speed/ST.maxSpeed, 0, 1);

  /* 曲柄 */
  const revs = ST.speed/(K.wheelR*K.gear);
  ST.cadence = revs*60;
  if (ST.speed < 0.50){
    // 缓停并停在“上下车姿势”（曲柄水平）
    ST.theta = damp(ST.theta, Math.round((ST.theta-Math.PI/2)/Math.PI)*Math.PI + Math.PI/2, 4.5, dt);
    ST.omega = 0;
  } else { ST.omega = TAU*revs; ST.theta += ST.omega*dt; }

  /* 交互状态衰减 */
  ST.steer  = damp(ST.steer, Math.sin(ST.t*0.57)*0.030*(0.35+sn), 3, dt);
  if (ST.wave > 0)     ST.wave     = Math.max(0, ST.wave - dt*0.62);
  if (ST.honk > 0)     ST.honk     = Math.max(0, ST.honk - dt*1.6);
  if (ST.lookAtCam > 0) ST.lookAtCam = Math.max(0, ST.lookAtCam - dt*0.5);
  if (ST.glance > 0){
    ST.glance = Math.max(0, ST.glance - dt);
    if (ST.t > ST.nextGlance){ ST.nextGlance = ST.t + rr(4.5,10); ST.glance = rr(1.2,2.2); }
  }
  if (bubbleT > 0){ bubbleT -= dt; if (bubbleT <= 0) bubble.classList.remove('show'); }

  uTime.value = ST.t;
  uWind.value = 0.45 + 0.85*sn;
  if (lightBlend !== duskTarget) { lightBlend = damp(lightBlend, duskTarget, 2.4, dt); applyLight(); }

  updateRig(dt);
  updateCamera(dt);

  /* 环境 */
  const dd = ST.speed*dt;
  uDist.value = ST.dist;
  trees.update(dd); bushes.update(dd); rocks.update(dd); flowers.update(dd); grass.update(dd);
  for (const c of clouds){
    c.position.x += c.userData.spd*dt;
    c.position.z -= dd*0.32;
    c.position.y = c.userData.baseY + Math.sin(ST.t*0.12 + c.userData.spd*9)*0.6;
    if (c.position.x > 130) c.position.x -= 200;
    if (c.position.z < -60) c.position.z += 220;
    if (c.position.z > 165) c.position.z -= 220;
  }
  /* 尘埃 */
  if (ST.speed > 1.2){
    const n = Math.min(4, Math.round((ST.speed-1.0)*0.85*dt*60));
    for (let i=0;i<n;i++) emitDust();
  }
  for (let i=0;i<DUST_N;i++){
    if (dustLife[i] <= 0) continue;
    dustLife[i] -= dt*0.75;
    dustVel[i].y -= dt*1.1; dustVel[i].z -= ST.speed*dt*0.5;
    dustPos[i*3]   += dustVel[i].x*dt;
    dustPos[i*3+1] += dustVel[i].y*dt;
    dustPos[i*3+2] += dustVel[i].z*dt;
    if (dustPos[i*3+1] < 0.02) dustPos[i*3+1] = 0.02;
    if (dustLife[i] <= 0) dustPos[i*3+1] = -50;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.aLife.needsUpdate = true;
  dustGeo.attributes.aSize.needsUpdate = true;

  /* 界面数值 */
  const kmh = ST.speed*3.6;
  spdEl.textContent = kmh.toFixed(1);
  barEl.style.width = (sn*100).toFixed(1)+'%';
  cadEl.textContent = ST.cadence.toFixed(0);
  modeEl.textContent = ST.paused ? '暂停' : (ST.speed < 0.35 ? '静止' : (sn > 0.62 ? '疾驰' : '骑行'));

  /* 气泡跟随 */
  if (bubbleT > 0){
    _headW.set(0, 0.10, 0.16).applyMatrix4(headG.matrixWorld).project(camera);
    bubble.style.left = ((_headW.x*0.5+0.5)*innerWidth)+'px';
    bubble.style.top  = ((-_headW.y*0.5+0.5)*innerHeight)+'px';
  }
}

/* ---- 渲染 ---- */
const clock = new THREE.Clock();

/* ---- 运动学自检（?self=1 时输出到 DOM，便于无头环境核验） ---- */
function selfTest(){
  const L = [];
  const w = (o)=>{ o.updateWorldMatrix(true,false); const v=new THREE.Vector3().setFromMatrixPosition(o.matrixWorld); return v; };
  const bad = (x)=> !isFinite(x);
  L.push('theta='+ST.theta.toFixed(3)+' speed='+ST.speed.toFixed(2)+' ride='+ST.ride.toFixed(3));
  L.push('bike rot z='+bike.rotation.z.toFixed(3)+' pelican y='+pelican.position.y.toFixed(3));
  for (const leg of legs){
    const ph = leg.s>0 ? ST.theta+Math.PI : ST.theta;
    const px = leg.s*K.pedalX, py = K.bb.y+K.crank*Math.cos(ph), pz = K.bb.z+K.crank*Math.sin(ph);
    const ankle = w(leg.foot);
    const hip = new THREE.Vector3().copy(leg.hip).applyMatrix4(pelican.matrixWorld);
    const knee = w(leg.knee);
    const reach = hip.distanceTo(ankle), maxL = leg.L1+leg.L2;
    const sole = ankle.clone(); sole.y -= 0.038;
    L.push(`leg${leg.s>0?'R':'L'} ankle=(${ankle.x.toFixed(3)},${ankle.y.toFixed(3)},${ankle.z.toFixed(3)}) `
      +`pedalTop=(${px.toFixed(3)},${(py+0.008).toFixed(3)},${pz.toFixed(3)}) `
      +`soleY=${sole.y.toFixed(3)} dy=${(sole.y-(py+0.008)).toFixed(4)} dz=${(ankle.z-pz).toFixed(4)} `
      +`reach=${reach.toFixed(3)}/${maxL.toFixed(2)} knee=(${knee.x.toFixed(2)},${knee.y.toFixed(2)},${knee.z.toFixed(2)}) nan=${bad(reach)||bad(ankle.y)}`);
  }
  for (const wg of wings){
    const sh = new THREE.Vector3().copy(wg.shoulder).applyMatrix4(pelican.matrixWorld);
    const hand = w(wg.hand);
    const grip = new THREE.Vector3(wg.s*K.grip.x, K.grip.y, K.grip.z).applyMatrix4(bike.matrixWorld);
    const reach = sh.distanceTo(hand), maxL = wg.L1+wg.L2;
    L.push(`wing${wg.s>0?'R':'L'} hand=(${hand.x.toFixed(3)},${hand.y.toFixed(3)},${hand.z.toFixed(3)}) `
      +`grip=(${grip.x.toFixed(3)},${grip.y.toFixed(3)},${grip.z.toFixed(3)}) err=${hand.distanceTo(grip).toFixed(4)} `
      +`reach=${reach.toFixed(3)}/${maxL.toFixed(2)} nan=${bad(reach)}`);
  }
  const head = w(headG);
  const beakTip = new THREE.Vector3(0,-0.01,0.40).applyMatrix4(headG.matrixWorld);
  L.push(`head=(${head.x.toFixed(2)},${head.y.toFixed(2)},${head.z.toFixed(2)}) beakTip=(${beakTip.x.toFixed(2)},${beakTip.y.toFixed(2)},${beakTip.z.toFixed(2)})`);
  L.push('neck pts: '+neckPts.map(p=>`(${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)})`).join(' '));
  // 链条连续性
  let maxJump = 0;
  for (let i=0;i<64;i++){ const a=chainPoint(i*chainPath.total/64), b=chainPoint((i+1)*chainPath.total/64);
    maxJump = Math.max(maxJump, Math.hypot(a.y-b.y, a.z-b.z)); }
  L.push(`chain len=${chainPath.total.toFixed(3)} links=${CHAIN_N} maxSegGap=${maxJump.toFixed(4)} pitch=${(chainPath.total/CHAIN_N).toFixed(4)}`);
  L.push(`wheelAngle=${wheelAngle.toFixed(2)} cadence=${ST.cadence.toFixed(0)}rpm dist=${ST.dist.toFixed(1)}`);
  L.push('drawcalls='+renderer.info.render.calls+' tris='+renderer.info.render.triangles);
  const pre=document.createElement('pre'); pre.id='selftest'; pre.textContent=L.join('\n'); document.body.appendChild(pre);
}

let _frames = 0;
function loop(){
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
  if (QS.get('probe') && ++_frames === (parseInt(QS.get('probe'),10)||30)){ selfTest(); dumpLogs(); }
}

$('#load').classList.add('gone');
if (!SHOT) setTimeout(()=>$('#load').remove(), 900);

if (SHOT){
  $('#load').remove();
  // 确定性截图模式：固定尺寸 + 固定步长预演
  const SW = parseInt(QS.get('w')||'1100',10), SHh = parseInt(QS.get('h')||'640',10);
  renderer.setPixelRatio(1);
  renderer.setSize(SW, SHh, false);
  camera.aspect = SW/SHh; camera.updateProjectionMatrix();
  if (QS.get('dbg')){
    scene.fog = null; ground.visible = false;
    for (const f of [trees,bushes,rocks,flowers,grass]) f.ims.forEach(im=>im.visible=false);
    clouds.forEach(c=>c.visible=false); dustPts.visible = false;
    hemi.intensity = 1.15; sun.intensity = 2.4; rim.intensity = 0.5;
    if (QS.get('dbg') === '2'){ sky.visible = false; scene.background = new THREE.Color(0x101418); }
    camera.position.set(0, 1.2, 9); camera.lookAt(0,0.95,0); cam.manual = true;
    cam.az = parseFloat(QS.get('dbgaz')||'1.5708');
    cam.pol = parseFloat(QS.get('dbgpol')||'1.50');
    cam.dist = parseFloat(QS.get('dbgdist')||'5.0');
    cam.tgt.set(0, parseFloat(QS.get('dbgy')||'0.95'), 0);
    cam.fov = parseFloat(QS.get('dbgfov')||'36');
  }
  const sp = parseFloat(QS.get('speed') || '6');
  ST.target = sp; ST.speed = sp; ST.theta = parseFloat(QS.get('theta') || '1.1');
  const n = Math.round(SHOT_SIM*60);
  for (let i=0;i<n;i++){
    ST.speed = ST.target; ST.dist += ST.speed/60;
    ST.ride = damp(ST.ride, smooth(0.20,1.70,ST.speed), 4.5, 1/60);
    ST.omega = TAU*(ST.speed/(K.wheelR*K.gear));
    ST.theta += ST.omega/60;
    uDist.value = ST.dist; ST.t += 1/60;
    updateRig(1/60); updateCamera(1/60);
    trees.update(ST.speed/60); bushes.update(ST.speed/60); rocks.update(ST.speed/60);
    flowers.update(ST.speed/60); grass.update(ST.speed/60);
  }
  if (duskTarget){ lightBlend = 1; applyLight(); }
  if (QS.get('ui') === '0') ui.classList.add('hidden');
  renderer.render(scene, camera);
  window.__READY = true;
  document.title = 'SHOT_OK';
  if (QS.get('self') === '1') dumpLogs(), selfTest();
  else dumpLogs();
} else {
  requestAnimationFrame(loop);
}

</script>

    :root{color-scheme:dark;--page:#1d1921;--panel:#242029;--line:#3a323e;--muted:#bdb1be;--text:#faf1e8;--accent:#f3b193;--sans:'DM Sans',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--text);font:500 14px/1.4 var(--sans)}
    button,input{font:inherit}
    button{color:inherit;cursor:pointer}
    button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    button:disabled,input:disabled{cursor:default;opacity:.45}
    button:disabled:hover{transform:none}
    .shell{width:min(100% - 88px,1600px);margin:0 auto;padding:0 0 22px}
    .topbar{display:flex;align-items:center;justify-content:space-between;min-height:76px;position:relative;z-index:3;gap:18px}
    .brand{display:flex;align-items:center;gap:11px;color:var(--text);font-size:13px;font-weight:700;letter-spacing:.125em;text-transform:uppercase}
    .brand-mark{position:relative;width:29px;height:29px;border:1px solid #e5a388;border-radius:50%;display:block;transform:rotate(-21deg)}
    .brand-mark:before,.brand-mark:after{content:"";position:absolute;border-color:#e5a388;border-style:solid}
    .brand-mark:before{width:8px;height:12px;border-width:1px 1px 0 0;border-radius:0 8px 0 0;left:8px;top:6px;transform:rotate(-36deg)}
    .brand-mark:after{width:13px;border-width:1px 0 0;left:8px;top:16px;transform:rotate(24deg)}
    .ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;transition:color .18s,background .18s,border-color .18s}
    .ghost:hover,.ghost[aria-expanded=true]{color:var(--text);background:#302834;border-color:#5b4857}
    .help-icon{width:15px;height:15px;border:1px solid currentColor;border-radius:50%;font:700 10px/13px var(--sans);text-align:center}
    .instructions{position:absolute;top:65px;right:0;width:min(316px,100%);padding:18px 20px;background:#29222e;border:1px solid #4f4051;border-radius:8px;box-shadow:0 20px 60px #110d17a0}
    .instructions[hidden]{display:none}
    .instructions h2{font-size:15px;margin:0 0 13px;font-weight:700}
    .instructions dl{margin:0;display:grid;grid-template-columns:1fr auto;row-gap:10px;column-gap:16px;font-size:12px;color:var(--muted);align-items:center}
    .instructions dt,.instructions dd{margin:0}
    kbd{display:inline-block;letter-spacing:.025em;border:1px solid #5a4959;border-radius:4px;padding:1px 5px;font:600 10px/1.5 var(--sans);color:var(--text)}
    .scene{height:clamp(460px,calc(100svh - 193px),900px);overflow:hidden;position:relative;isolation:isolate;display:block;border:1px solid #5a4550;border-radius:11px 11px 0 0;background:#71525f}
    .scene canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:grab}
    .scene canvas:active{cursor:grabbing}
    .scene canvas:focus-visible{outline-offset:-4px}
    .scene::after{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(90deg,#24172737 0%,transparent 40%),linear-gradient(0deg,#261b2e70,transparent 19%);box-shadow:inset 0 0 70px #30203230}
    .scene-title{position:absolute;z-index:2;top:clamp(27px,5.5vw,69px);left:clamp(24px,4vw,64px);pointer-events:none;text-shadow:0 3px 25px #3e263377}
    .scene-title p{margin:0 0 13px;text-transform:uppercase;letter-spacing:.25em;font-weight:700;font-size:10px;color:#ffdec9}
    .scene-title h1{margin:0;font:400 clamp(65px,8.1vw,137px)/.81 var(--serif);letter-spacing:-.044em;color:#fff5e8}
    .scene-title em{display:block;font-weight:400;color:#ffe0c6}
    .scene-tools{position:absolute;z-index:2;top:21px;right:22px;display:flex;gap:8px}
    .scene-tools .ghost{background:#2d21365e;color:#fff1e2;border-color:#fff1de45;backdrop-filter:blur(9px)}
    .scene-tools .ghost:hover{background:#2d2136b0}
    .reset-icon{width:12px;height:12px;border:1px solid currentColor;border-right-color:transparent;border-radius:50%;position:relative}
    .reset-icon:after{content:"";position:absolute;right:-1px;top:-1px;width:4px;height:4px;border-top:1px solid;border-right:1px solid;transform:rotate(10deg)}
    .scene-footer{position:absolute;z-index:2;bottom:21px;left:clamp(18px,2.6vw,35px);right:clamp(18px,2.6vw,35px);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;color:#fff2e6;font-size:11px;font-weight:600;text-shadow:0 1px 8px #302033}
    .gestures{display:flex;align-items:center;gap:9px}
    .mouse{position:relative;display:inline-block;width:10px;height:15px;border:1px solid currentColor;border-radius:5px;opacity:.8}
    .mouse:after{content:"";position:absolute;top:3px;width:1px;height:3px;left:3.5px;background:currentColor}
    .distance{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .distance span{color:#f1d4cb}
    .distance output{font-weight:700;letter-spacing:.04em}
    .loading{position:absolute;z-index:2;inset:0;display:grid;place-items:center;text-align:center;padding:26px;background:#2b21354d;color:#fff3ea;pointer-events:none}
    .loading[hidden]{display:none}
    .toolbar{display:grid;grid-template-columns:minmax(264px,1fr) auto minmax(132px,1fr);align-items:center;gap:24px;padding:15px 23px;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px;min-height:83px}
    .pace,.angle,.lighting{display:flex;align-items:center;gap:14px}
    .transport{flex:0 0 42px;width:42px;height:42px;display:grid;place-items:center;background:var(--accent);border:0;color:#331f27;border-radius:7px;transition:background .18s,transform .18s;box-shadow:0 2px 8px #160f1880}
    .transport:hover{background:#ffcaab;transform:translateY(-1px)}
    .play-icon{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid currentColor;margin-left:2px}
    .transport[aria-pressed=true] .play-icon{width:10px;height:12px;border:0;border-left:3px solid;border-right:3px solid;margin-left:0}
    .range-block{display:flex;gap:11px;align-items:center;min-width:0}
    .control-label{font-size:11px;font-weight:700;color:#c7bac9;white-space:nowrap}
    input[type=range]{width:clamp(62px,8vw,122px);height:19px;appearance:none;background:none;cursor:pointer;margin:0;--fill:48.387%;accent-color:var(--accent)}
    input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--fill),#584958 var(--fill))}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:0;margin-top:-4.5px;box-shadow:0 0 0 3px #f3b19324}
    input[type=range]::-moz-range-track{height:3px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--fill),#584958 var(--fill))}
    input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:0;box-shadow:0 0 0 3px #f3b19324}
    #speed-value{font:700 12px/1 var(--sans);font-variant-numeric:tabular-nums;width:40px;white-space:nowrap;color:var(--accent)}
    .segmented{display:flex;padding:3px;border-radius:7px;background:#1d1821;border:1px solid #3d3441;gap:2px}
    .segmented button{border:0;border-radius:4px;background:none;color:#bcb0c2;padding:7px 13px;white-space:nowrap;font-size:12px;font-weight:600;transition:background .18s,color .18s}
    .segmented button:hover{background:#332938;color:var(--text)}
    .segmented button[aria-pressed=true]{background:#483645;color:#ffddc6}
    .lighting{justify-self:end}
    .light-icon{width:12px;height:12px;border:1px solid #ffc6a7;border-radius:50%;display:block;position:relative;overflow:hidden}
    .light-icon::after{content:"";position:absolute;inset:0 0 0 50%;background:#f3b193}
    .lighting .ghost[aria-pressed=true] .light-icon::after{inset:0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1020px){.shell{width:calc(100% - 54px)}.toolbar{gap:17px;padding-inline:16px}.pace,.angle,.lighting{gap:10px}.range-block{gap:8px}.segmented button{padding-inline:10px}}
    @media(max-width:740px){.shell{width:calc(100% - 28px);padding-bottom:14px}.topbar{min-height:60px}.instructions{top:53px}.scene{height:clamp(420px,calc(100svh - 183px),690px)}.toolbar{min-height:108px;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:10px 12px}.pace{grid-column:1/2}.angle{grid-column:1/-1;grid-row:2;justify-content:center}.lighting{grid-column:2;grid-row:1}.range-block{flex-wrap:wrap}.lighting>.control-label{display:none}.transport{width:36px;height:36px;flex-basis:36px}.scene-title{top:29px;left:22px}.scene-title h1{font-size:clamp(63px,13vw,87px)}.scene-title p{margin-bottom:12px}.scene-tools{right:12px;top:14px}.scene-tools .ghost{padding:6px 8px}.scene-footer{left:13px;right:13px;bottom:12px;font-size:10px}}
    @media(max-width:380px){.toolbar .pace{gap:8px}.range-block{gap:6px}.range-block .control-label{font-size:10px}.lighting .ghost{padding:8px}.scene-footer .mouse{display:none}.scene-footer{gap:5px}.scene-title h1{font-size:58px}}
    @media(pointer:coarse){.mouse{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Pelican Velo</div>
      <button id="help" class="ghost" type="button" aria-controls="instructions" aria-expanded="false"><span class="help-icon" aria-hidden="true">?</span>Controls</button>
      <aside id="instructions" class="instructions" hidden>
        <h2>Ride controls</h2>
        <dl>
          <dt>Pause or resume</dt><dd><kbd>Space</kbd></dd>
          <dt>Follow, profile or orbit</dt><dd><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></dd>
          <dt>Orbit the rider</dt><dd>Drag / <kbd>←</kbd> <kbd>→</kbd></dd>
          <dt>Zoom in or out</dt><dd>Scroll / pinch / <kbd>+</kbd> <kbd>−</kbd></dd>
          <dt>Reset the camera</dt><dd><kbd>R</kbd></dd>
        </dl>

  ];
  const terrainRows = contours.map(([z, y], row) => Array.from({ length: 66 }, (_, i) => {
    const x = (i - 32.5) * 4.2;
    const roughness = Math.abs(z) < 2.5 ? 0 : Math.min(Math.abs(z) * .033, .7);
    return [x + .75 * Math.sin(i * 1.7 + row * 2.6),
      y + (Math.sin(i * 1.3 + row * .2) + .45 * Math.sin(i * .71)) * roughness,
      z + .34 * Math.sin(i * 2.33 + row * .93) * Math.min(roughness * 3.5, 2)];
  }));
  for (let row = 0; row < terrainRows.length - 1; row++) {
    for (let i = 0; i < terrainRows[row].length - 1; i++) {
      const tint = color(contours[row][2]).lerp(color(contours[row + 1][2]), .35).multiplyScalar(.96 + random() * .09);
      const a = terrainRows[row][i], b = terrainRows[row][i + 1], c = terrainRows[row + 1][i], d = terrainRows[row + 1][i + 1];
      terrainFace(terrainPoints, terrainShades, a, c, b, tint);
      terrainFace(terrainPoints, terrainShades, b, c, d, tint.clone().multiplyScalar(.98 + random() * .04));
    }
  }

  function triangleHeight(x, z, a, b, c) {
    const bx = b[0] - a[0], bz = b[2] - a[2];
    const cx = c[0] - a[0], cz = c[2] - a[2];
    const dx = x - a[0], dz = z - a[2];
    const determinant = bx * cz - bz * cx;
    const u = (dx * cz - dz * cx) / determinant;
    const v = (bx * dz - bz * dx) / determinant;
    if (u >= 0 && v >= 0 && u + v <= 1) return a[1] * (1 - u - v) + b[1] * u + c[1] * v;
    return NaN;
  }

  function terrainHeight(x, z) {
    let row = 0;
    while (row < contours.length - 2 && contours[row + 1][0] < z) row++;
    const column = Math.floor(x / 4.2 + 32.5);
    for (let j = Math.max(row - 1, 0); j <= Math.min(row + 1, terrainRows.length - 2); j++) {
      for (let i = column - 1; i <= column + 1; i++) {
        const a = terrainRows[j][i], b = terrainRows[j][i + 1];
        const c = terrainRows[j + 1][i], d = terrainRows[j + 1][i + 1];
        const upper = triangleHeight(x, z, a, c, b);
        if (Number.isFinite(upper)) return upper;
        const lower = triangleHeight(x, z, b, c, d);
        if (Number.isFinite(lower)) return lower;
      }
    }
    return -.07;
  }

  function texturedGround(material, detail) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.envRideDistance = distance;
      shader.vertexShader = `varying vec3 envGroundPosition;\n${shader.vertexShader}`
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nenvGroundPosition = (modelMatrix * vec4(position, 1.0)).xyz;');
      shader.fragmentShader = `varying vec3 envGroundPosition;\nuniform float envRideDistance;\n${noiseGLSL}\n${shader.fragmentShader}`
        .replace('#include <color_fragment>', `#include <color_fragment>\nvec2 roadUV = envGroundPosition.xz + vec2(envRideDistance, 0.0);\n${detail}`);
    };
    material.customProgramCacheKey = () => detail;
    return material;
  }

  const terrain = new THREE.Mesh(meshFromTerrain(terrainPoints, terrainShades), texturedGround(
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .98 }), `
    float stone = valueNoise(roadUV * 3.6);
    float grain = valueNoise(roadUV * 90.0);
    diffuseColor.rgb *= .87 + .13 * stone + .16 * mix(grain, .5, smoothstep(.3, 1., length(fwidth(roadUV) * 90.)));
  `));
  terrain.receiveShadow = true;
  root.add(terrain);

  const road = new THREE.Mesh(new THREE.PlaneGeometry(158, 4.96), texturedGround(
    new THREE.MeshStandardMaterial({ color: '#A1888F', roughness: .94 }), `
    float mottle = valueNoise(roadUV * 3.4) * .68 + valueNoise(roadUV * .7) * .32;
    float grain = mix(valueNoise(roadUV * 120.), .5, smoothstep(.4, 1.1, length(fwidth(roadUV) * 120.)));
    float width = abs(roadUV.y);
    float shoulder = smoothstep(2.34, 2.48, width + (valueNoise(roadUV * 12.) - .5) * .022);
    diffuseColor.rgb *= .85 + grain * .18 + mottle * .20;
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.46, .325, .314), shoulder * .68);
    float aa = fwidth(width);
    float line = 1.0 - smoothstep(.025 - aa, .025 + aa, abs(width - 2.18));
    float dash = 1.0 - smoothstep(.26, .27, abs(fract((roadUV.x + 1.) / 4.8) - .5));
    float center = (1.0 - smoothstep(.019 - aa, .019 + aa, abs(roadUV.y + .92))) * dash;
    float wear = .54 + .46 * smoothstep(.30, .68, valueNoise(roadUV * 26.));
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.66, .50, .416), wear * max(line * .71, center * .59));
  `));
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0;
  road.receiveShadow = true;
  root.add(road);

  const scatteringLength = 88;
  const dummy = new THREE.Object3D();
  const props = [];
  function scatter(geometry, material, items, castShadow) {
    const mesh = new THREE.InstancedMesh(geometry, material, items.length);
    mesh.frustumCulled = false;
    mesh.castShadow = castShadow;
    mesh.receiveShadow = true;
    for (let i = 0; i < items.length; i++) mesh.setColorAt(i, color(items[i].tint));
    root.add(mesh);
    props.push({ mesh, items });
  }

  const rockColors = ['#AB7981', '#BD918C', '#C19384', '#9E7680', '#C8A398', '#BC8379'];
  const rockItems = Array.from({ length: 221 }, () => {
    const far = random() < .44;
    const offset = random() ** 1.9;
    const z = far ? -2.59 - offset * 3.23 : 2.63 + offset * 8.4;
    const scale = .025 + random() ** 2.7 * .27;

      x: random() * scatteringLength, y: scale * .14, z, angle: random() * tau,
      sx: scale * (1.4 + random() * 1.5), sy: scale * (.57 + random() * .53), sz: scale * (.7 + random() * .76),
      tint: rockColors[Math.floor(random() * rockColors.length)],
    };
  });
  scatter(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }), rockItems, true);

  const bladePositions = [], bladeColors = [];
  const bladePalette = ['#F0D2AD', '#D8BD9F', '#B89A89', '#BEB796', '#E4B692'];
  for (let i = 0; i < 11; i++) {
    const angle = random() * tau;
    const height = .29 + random() * .71;
    const lean = .14 + random() * .28;
    const width = .023 + random() * .031;
    const dx = Math.cos(angle), dz = Math.sin(angle);
    const base = [dx * .10, 0, dz * .10];
    const middle = [dx * lean * .54, height * .62, dz * lean * .54];
    const tip = [dx * lean, height, dz * lean];
    const startLeft = [base[0] - dz * width, 0, base[2] + dx * width];
    const startRight = [base[0] + dz * width, 0, base[2] - dx * width];
    const midLeft = [middle[0] - dz * width * .61, middle[1], middle[2] + dx * width * .61];
    const midRight = [middle[0] + dz * width * .61, middle[1], middle[2] - dx * width * .61];
    const tint = color(bladePalette[i % bladePalette.length]);

    terrainFace(bladePositions, bladeColors, midLeft, midRight, tip, tint);
  }
  const grass = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: .97 });
  grass.onBeforeCompile = (shader) => {
    shader.uniforms.envWind = time;

      #include <begin_vertex>
      float stemWind = sin(envWind * 2.1 + instanceMatrix[3].x * .58 + instanceMatrix[3].z * .9);

    const far = i < 89;

      x: random() * scatteringLength, y: -.014, z: far ? -2.66 - offset * 3.12 : 2.78 + offset * 5.75,

  });
  scatter(meshFromTerrain(bladePositions, bladeColors), grass, blades, false);

  const markers = Array.from({ length: 11 }, (_, i) => ({
    x: i * 8, y: .126, z: -2.88 + Math.sin(i * 8.23) * .13, angle: (i * 1.24) % .19,
    sx: .115, sy: .29 + (i % 3) * .026, sz: .105, tint: '#D9BCAC',
  }));

  scatter(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: .63 }),
    markers.map((marker) => ({ ...marker, y: marker.y + marker.sy * .39, sx: .118, sy: .046, sz: .108, tint: '#9A615F' })), false);

  function update(travel, elapsed, atmosphere) {
    time.value = elapsed;
    distance.value = travel;
    mood.value = atmosphere;
    const scroll = wrap(travel, scatteringLength);
    for (const { mesh, items } of props) {
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const x = wrap(item.x - scroll + scatteringLength * .5, scatteringLength) - scatteringLength * .5;
        dummy.position.set(x, terrainHeight(x, item.z) + item.y, item.z);
        dummy.rotation.set(0, item.angle, 0);
        dummy.scale.set(item.sx, item.sy, item.sz);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }
    distant.position.x = -Math.sin(travel * .009) * 1.0;
    middle.position.x = -Math.sin(travel * .018) * 2.0;
    near.position.x = -Math.sin(travel * .020) * 2.9;
  }

  update(0, 0, 0);
  return { update };
}

function createBicycle(THREE) {
  const group = new THREE.Group();
  group.name = 'Coastal road bicycle';
  const v = (x, y, z = 0) => new THREE.Vector3(x, y, z);
  const tau = Math.PI * 2;
  const yAxis = v(0, 1);
  const rear = v(-1.55, .98);
  const front = v(1.55, .98);
  const bracket = v(-.15, 1.04);
  const seatTubeTop = v(-.59, 2.26);
  const headTop = v(.94, 2.41);
  const headBottom = v(1.08, 2.04);
  const crankRadius = .242;
  const pedalWidth = .302;
  const ringRadius = .226;

  function surface(color, roughness, metalness = 0) {
    return new THREE.MeshStandardMaterial({ color, roughness, metalness });

  const enamel = new THREE.MeshPhysicalMaterial({
    color: 0xdc3d27, roughness: .29, metalness: .19,
    clearcoat: .66, clearcoatRoughness: .24
  });
  const burnt = surface(0x9c2b20, .38, .28);
  const cream = surface(0xf7d8ab, .48);
  const chrome = surface(0xc9d5d2, .28, .54);
  const polished = surface(0xe2e4da, .26, .43);
  const darkMetal = surface(0x414247, .40, .3);
  const rubber = surface(0x232329, .87);
  const leather = surface(0x4e2925, .86);
  const saddleTrim = surface(0xc67b4c, .72);
  const brass = surface(0xe2a05f, .38, .34);

  function mesh(parent, geometry, material, position, shadow = true) {
    const object = new THREE.Mesh(geometry, material);
    if (position) object.position.copy(position);
    object.castShadow = shadow;
    object.receiveShadow = shadow;
    parent.add(object);
    return object;
  }

  function bar(parent, a, b, radius, material, endRadius = radius, shadow = true) {
    const direction = b.clone().sub(a);
    const tube = mesh(parent, new THREE.CylinderGeometry(endRadius, radius, direction.length(), 14),
      material, a.clone().lerp(b, .5), shadow);
    tube.quaternion.setFromUnitVectors(yAxis, direction.normalize());
    return tube;
  }

  function curve(parent, points, radius, material, segments = 22, shadow = true) {
    const path = new THREE.CatmullRomCurve3(points);
    return mesh(parent, new THREE.TubeGeometry(path, segments, radius, 8, false), material, null, shadow);
  }

  function ring(parent, radius, thickness, material, z = 0, shadow = false) {
    return mesh(parent, new THREE.TorusGeometry(radius, thickness, 10, 112), material, v(0, 0, z), shadow);
  }

  function round(parent, position, scale, material) {
    const object = mesh(parent, new THREE.SphereGeometry(1, 24, 16), material, position);
    object.scale.set(...scale);
    return object;

  const tyreGeometry = new THREE.TorusGeometry(.909, .071, 28, 128);

      const rim = v(.829 * Math.cos(angle), .829 * Math.sin(angle), side * .012);

      setInstanceBar(nipples, i, rim.clone().lerp(hub, .042), rim);
    }
    wheelGroup.add(spokes, nipples);
    for (const side of [-1, 1]) {

  sleeve(bracket, headBottom, .707, .022, .071, brass);
  sleeve(seatTubeTop, v(.959, 2.357), .09, .072, .059, cream);
  sleeve(seatTubeTop, v(.959, 2.357), .13, .022, .059, brass);
  sleeve(bracket, seatTubeTop, .956, .076, .066, burnt);
  for (const at of [.045, .96]) sleeve(headBottom, headTop, at, .049, .089, polished);

  const badge = round(group, v(.49, 1.557, .062), [.112, .042, .014], brass);

  const inset = round(group, v(.49, 1.557, .073), [.075, .026, .008], burnt);
  inset.rotation.z = .682;
  const mark = round(group, v(.49, 1.557, .081), [.037, .010, .006], cream);
  mark.rotation.z = .682;

  bar(group, v(-.583, 2.24), v(-.64, 2.42), .036, polished);
  const saddleGeometry = new THREE.SphereGeometry(1, 34, 20);
  const saddleVertices = saddleGeometry.attributes.position;

  for (let i = 0; i <= 40; i++) {

  const gripEnds = {};

  curve(group, [v(.982, 2.474, -.073), v(.67, 2.333, -.083), v(-.448, 2.281, -.088),

  function pedalPoint(side, crankAngle, target = new THREE.Vector3()) {

  }

      axis.subVectors(b, a);
      extension.position.copy(a);
      extension.scale.x = axis.length();
      extension.quaternion.setFromUnitVectors(forward, axis.normalize());
      tip.quaternion.copy(extension.quaternion);
    }
  }

  return { group: bird, update };
}

(function startRide() {
  'use strict';

  const $ = id => document.getElementById(id);
  const stage = $('scene');
  const loading = $('loading');
  const playButton = $('play');
  const speedInput = $('speed');
  const lightButton = $('light');
  const resetButton = $('reset-view');
  const help = $('help');
  const instructions = $('instructions');
  const cameraButtons = [...document.querySelectorAll('[data-camera-mode]')];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setHelp(open) {
    help.setAttribute('aria-expanded', String(open));
    instructions.hidden = !open;
  }

  help.addEventListener('click', () => setHelp(instructions.hidden));
  document.addEventListener('pointerdown', event => {
    if (!instructions.hidden && !help.contains(event.target) && !instructions.contains(event.target)) setHelp(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !instructions.hidden) {
      setHelp(false);
      help.focus();
    }
  });

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (error) {
    loading.textContent = 'This ride needs WebGL 2. Enable hardware acceleration or try another browser.';
    stage.dataset.playing = 'false';
    for (const control of [playButton, speedInput, lightButton, resetButton, ...cameraButtons]) control.disabled = true;
    return;
  }

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const canvas = renderer.domElement;
  canvas.tabIndex = 0;
  canvas.setAttribute('aria-label', '3D pelican riding a bicycle. Use the arrow keys to orbit.');
  stage.prepend(canvas);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, .065, 330);
  const focus = new THREE.Vector3(-.03, 1.95, 0);
  const ambient = new THREE.HemisphereLight('#ffebe6', '#9b6875', 2.06);
  const sun = new THREE.DirectionalLight('#ffd1a7', 2.55);
  sun.position.set(-3.4, 6.2, -4.4);
  sun.target.position.set(0, 1.35, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -5.6, right: 5.6, top: 5.3, bottom: -4.8, near: .5, far: 17 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -.0003;
  sun.shadow.normalBias = .024;
  const fill = new THREE.DirectionalLight('#e5d6f9', .81);
  fill.position.set(2.1, 4.6, 6.5);
  scene.add(ambient, sun, sun.target, fill);

  const environment = createEnvironment(THREE, scene);
  const bike = createBicycle(THREE);
  const rider = createPelican(THREE, bike);
  const rig = new THREE.Group();
  rig.add(bike.group, rider.group);
  scene.add(rig);

  // This broad soft contact pass complements the directionally cast shadows.
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 2.1), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    vertexShader: `varying vec2 shadowUV;
      void main() {
        shadowUV = uv * 2.0 - 1.0;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `varying vec2 shadowUV;
      void main() {
        vec2 p = shadowUV * vec2(1.15, 1.3);
        float base = 1.0 - smoothstep(0.03, 1.0, length(p));
        float tire = 1.0 - smoothstep(0.04, 0.29, length(vec2(abs(p.x) - 0.54, p.y)));
        gl_FragColor = vec4(0.15, 0.092, 0.128, 0.22 * base + 0.24 * tire);
        #include <colorspace_fragment>
      }`
  }));
  contact.rotation.x = -Math.PI / 2;
  contact.position.y = .012;
  scene.add(contact);

  const presets = {
    follow: { heading: .27, elevation: .134, zoom: 1 },
    profile: { heading: 0, elevation: .082, zoom: 1.03 },
    orbit: { heading: .75, elevation: .24, zoom: 1.05 }
  };
  const target = { ...presets.follow };
  const view = { ...target };
  const pointers = new Map();
  const clip = THREE.MathUtils.clamp;
  const mix = THREE.MathUtils.lerp;
  const wrap = THREE.MathUtils.euclideanModulo;
  const wheelRadius = .98;
  const gearing = 2.65;
  const baseVelocity = 14.5;
  const worldUnitsPerMeter = 2.8;
  const duskKey = new THREE.Color('#ffd1a7');
  const dawnKey = new THREE.Color('#ffebc9');
  const duskSky = new THREE.Color('#ffebe6');
  const dawnSky = new THREE.Color('#e4ebff');
  const duskGround = new THREE.Color('#9b6875');
  const dawnGround = new THREE.Color('#b0868b');
  let playing = !reducedMotion;
  let cameraMode = 'follow';
  let requestedSpeed = Number(speedInput.value);
  let currentSpeed = requestedSpeed;
  let atmosphereTarget = 0;
  let atmosphere = 0;
  let elapsed = .7;
  let distance = 0;
  let previousTime = 0;
  let width = 0, height = 0;
  let dirty = true;
  let contextLost = false;
  let lastDistance = '';

  function announce(message) { $('status').textContent = message; }

  function setPlaying(active, report = true) {
    playing = active;
    stage.dataset.playing = String(active);
    playButton.setAttribute('aria-pressed', String(active));
    const action = active ? 'Pause ride' : 'Resume ride';
    playButton.setAttribute('aria-label', action);
    playButton.title = `${action} (Space)`;
    if (report) announce(active ? 'Ride resumed' : 'Ride paused');
    dirty = true;
  }

  function setSpeed() {
    requestedSpeed = Number(speedInput.value);
    speedInput.style.setProperty('--fill', `${100 * (requestedSpeed - .25) / 1.55}%`);
    $('speed-value').value = `${requestedSpeed.toFixed(2)}×`;
    speedInput.setAttribute('aria-valuetext', `${requestedSpeed.toFixed(2)} times normal pace`);
  }

  function setCamera(mode, reframe = true) {
    if (reframe) Object.assign(target, presets[mode]);
    if (mode === cameraMode && !reframe) return;
    cameraMode = mode;
    stage.dataset.camera = mode;
    for (const button of cameraButtons) button.setAttribute('aria-pressed', String(button.dataset.cameraMode === mode));
    announce(`${mode[0].toUpperCase()}${mode.slice(1)} camera`);
    dirty = true;
  }

  function orbitBy(dx, dy) {
    setCamera('orbit', false);
    target.heading -= dx * .007;
    target.elevation = clip(target.elevation + dy * .0057, .055, 1.13);
    dirty = true;
  }

  function zoomBy(scale) {
    target.zoom = clip(target.zoom * scale, .68, 1.74);
    dirty = true;
  }

  function setLighting() {
    atmosphereTarget = 1 - atmosphereTarget;
    const label = atmosphereTarget ? 'Dawn' : 'Dusk';
    stage.dataset.light = label.toLowerCase();
    lightButton.setAttribute('aria-pressed', String(Boolean(atmosphereTarget)));
    $('light-label').textContent = label;
    announce(`${label} lighting`);
    dirty = true;
  }

  function resize() {
    width = Math.max(1, stage.clientWidth);
    height = Math.max(1, stage.clientHeight);
    renderer.setSize(width, height, false);
    const wide = width >= 720 && width / height >= 1.15;
    camera.setViewOffset(width, height, wide ? -width * .115 : 0, wide ? 0 : -height * .115, width, height);
    dirty = true;
  }

  new ResizeObserver(resize).observe(stage);
  resize();
  setPlaying(playing, false);
  setSpeed();
  if (matchMedia('(pointer: coarse)').matches) $('gesture-hint').textContent = 'Drag to orbit · Pinch to zoom';

  playButton.addEventListener('click', () => setPlaying(!playing));
  speedInput.addEventListener('input', setSpeed);
  lightButton.addEventListener('click', setLighting);
  resetButton.addEventListener('click', () => setCamera('follow'));
  for (const button of cameraButtons) button.addEventListener('click', () => setCamera(button.dataset.cameraMode));

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? height : 1;
    zoomBy(Math.exp(clip(event.deltaY * units, -220, 220) * .0014));
  }, { passive: false });

  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0 || pointers.size >= 2) return;
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  });

  canvas.addEventListener('pointermove', event => {
    const old = pointers.get(event.pointerId);
    if (!old) return;
    const next = { x: event.clientX, y: event.clientY };
    if (pointers.size === 2) {
      const other = [...pointers.entries()].find(([id]) => id !== event.pointerId)[1];
      const before = Math.hypot(old.x - other.x, old.y - other.y);
      const after = Math.hypot(next.x - other.x, next.y - other.y);
      if (before > 6 && after > 6) zoomBy(before / after);
    } else if (next.x !== old.x || next.y !== old.y) {
      orbitBy(next.x - old.x, next.y - old.y);
    }
    pointers.set(event.pointerId, next);
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    canvas.addEventListener(type, event => pointers.delete(event.pointerId));
  }

  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target.matches('input,textarea,select,[contenteditable]')) return;
    const key = event.key.toLowerCase();
    if (key === ' ' && !event.target.closest('button')) {
      event.preventDefault();
      if (!event.repeat) setPlaying(!playing);
    } else if (key === '1' || key === '2' || key === '3') {
      setCamera(['follow', 'profile', 'orbit'][Number(key) - 1]);
    } else if (key === 'r') {
      setCamera('follow');
    } else if (key === '+' || key === '=') {
      zoomBy(.90);
    } else if (key === '-') {
      zoomBy(1.11);
    } else if (event.target === canvas && key.startsWith('arrow')) {
      event.preventDefault();
      orbitBy((key === 'arrowright' ? 1 : key === 'arrowleft' ? -1 : 0) * 12,
        (key === 'arrowdown' ? 1 : key === 'arrowup' ? -1 : 0) * 10);
    }
  });

  canvas.addEventListener('webglcontextlost', event => {
    event.preventDefault();
    contextLost = true;
    loading.textContent = 'Reconnecting to WebGL…';
    loading.hidden = false;
  });
  canvas.addEventListener('webglcontextrestored', () => {
    contextLost = false;
    dirty = true;
  });

  function updateCamera(dt, first) {
    const damping = first || reducedMotion ? 1 : 1 - Math.exp(-8.5 * dt);
    const drift = cameraMode === 'follow' ? .029 * Math.sin(elapsed * .64) : 0;
    const headingDelta = wrap(target.heading + drift - view.heading + Math.PI, Math.PI * 2) - Math.PI;
    const elevationDelta = target.elevation - view.elevation;
    const zoomDelta = target.zoom - view.zoom;
    view.heading += headingDelta * damping;
    view.elevation += elevationDelta * damping;
    view.zoom += zoomDelta * damping;
    stage.dataset.zoom = target.zoom.toFixed(3);
    const fit = Math.max(1, 1.025 / (width / height));
    const radius = 8.95 * fit * view.zoom;
    const projectedRadius = Math.cos(view.elevation) * radius;
    camera.position.set(focus.x + Math.sin(view.heading) * projectedRadius,
      focus.y + Math.sin(view.elevation) * radius, focus.z + Math.cos(view.heading) * projectedRadius);
    camera.lookAt(focus);
    return Math.abs(headingDelta) + Math.abs(elevationDelta) + Math.abs(zoomDelta) > .00008;
  }

  function updateRig(dt) {
    if (playing) {
      currentSpeed = mix(currentSpeed, requestedSpeed, 1 - Math.exp(-5 * dt));
      distance += baseVelocity * currentSpeed * dt;
      elapsed += dt;
    }
    // A shared distance drives rolling, crank phase and passing scenery.
    const wheelAngle = -distance / wheelRadius;
    const crankAngle = wheelAngle / gearing - .88;
    const effort = Math.min(1, .53 + currentSpeed * .37);
    const steer = (.026 * Math.sin(crankAngle) + .017 * Math.sin(elapsed * .82)) * effort;
    rig.rotation.x = (.031 * Math.sin(crankAngle + .22) + .008 * Math.sin(elapsed * 1.8)) * effort;
    bike.update(wheelAngle, crankAngle, steer);
    rider.update(crankAngle, elapsed, effort);
    const meters = distance / worldUnitsPerMeter;
    const display = meters < 1000 ? `${meters.toFixed(1)} m` : `${(meters / 1000).toFixed(2)} km`;
    if (display !== lastDistance) {
      $('distance').value = display;
      lastDistance = display;
    }
  }

  function frame(timestamp) {
    requestAnimationFrame(frame);
    const first = previousTime === 0;
    const dt = first ? 0 : Math.min(.075, (timestamp - previousTime) / 1000);
    previousTime = timestamp;
    if (contextLost) return;
    const cameraMoving = updateCamera(dt, first);
    const lightingChanging = Math.abs(atmosphereTarget - atmosphere) > .001;
    if (!dirty && !playing && !cameraMoving && !lightingChanging) return;

    if (first || playing) updateRig(dt);
    if (lightingChanging) {
      atmosphere = reducedMotion ? atmosphereTarget : mix(atmosphere, atmosphereTarget, 1 - Math.exp(-3.7 * dt));
      ambient.color.copy(duskSky).lerp(dawnSky, atmosphere);
      ambient.groundColor.copy(duskGround).lerp(dawnGround, atmosphere);
      ambient.intensity = mix(2.06, 2.43, atmosphere);
      sun.color.copy(duskKey).lerp(dawnKey, atmosphere);
      sun.intensity = mix(2.55, 2.85, atmosphere);
    }
    environment.update(distance, elapsed, atmosphere);
    renderer.render(scene, camera);
    loading.hidden = true;
    dirty = false;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

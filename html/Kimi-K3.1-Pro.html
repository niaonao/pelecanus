  <style>
    :root {
      --ink: #183f40;

    * { box-sizing: border-box; }

    body {
      color: var(--ink);

    button, input { font: inherit; }

    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: .10;
      background-image: radial-gradient(rgba(24,63,64,.25) .45px, transparent .6px);
      background-size: 5px 5px;

    .topbar {
      position: fixed; z-index: 5; top: 0; left: 0; right: 0;

    .brand { display: flex; align-items: center; gap: 12px; letter-spacing: .17em; font-size: 11px; font-weight: 750; }
    .brand-mark {
      display: grid; place-items: center; width: 35px; height: 35px; border: 1px solid var(--ink);

    #loading.done { opacity: 0; visibility: hidden; }
    .loading-inner { text-align: center; }
    .loading-wheel { width: 42px; height: 42px; margin: 0 auto 20px; border: 1px solid rgba(24,63,64,.18); border-top-color: var(--coral); border-radius: 50%; animation: spin 1.2s linear infinite; }
    .loading-title { font-family: Georgia, "Songti SC", serif; font-size: 21px; letter-spacing: .08em; }
    #loadingMessage { max-width: 360px; margin: 12px 20px 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1050px) {

    @media (max-width: 680px) {

      .round-button { width: 43px; height: 43px; }
      .speed-control { flex: 1; max-width: 180px; }
      .text-button { min-width: 46px; padding: 8px 2px; font-size: 10px; }
      .divider { height: 26px; }
    }
    @media (max-width: 390px) {
      .text-button span { display: none; }
      .controls { gap: 7px; }
      .live-badge { letter-spacing: .04em; }
    }

  <script>
    window.addEventListener('error', function (event) {
      if (!window.__PELICAN_READY__) document.getElementById('loadingMessage').textContent = '场景未能启动：' + (event.message || '请确认浏览器支持 WebGL，并可访问 Three.js CDN。');
    });
    setTimeout(function () {
      if (!window.__PELICAN_READY__) document.getElementById('loadingMessage').textContent = '仍在加载。首次打开需要联网获取 Three.js；请检查网络或 CDN 访问情况。';
    }, 15000);

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* CYCLING_MATH_START */
    const CyclingMath = {
      wheelAngle(distance, radius) { return -distance / radius; },
      crankAngle(distance, radius, ratio) { return this.wheelAngle(distance, radius) / ratio; },
      pedalPosition(angle, phase, center, radius) {
        const a = angle + phase;
        return { x: center.x + Math.cos(a) * radius, y: center.y + Math.sin(a) * radius };
      },
      solveTwoBone(hip, ankle, upper, lower) {
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const rawDistance = Math.hypot(dx, dy);
        const distance = Math.max(rawDistance, 1e-8);
        const ux = dx / distance, uy = dy / distance;
        const reachable = Math.min(distance, upper + lower - 1e-7);
        const along = (upper * upper - lower * lower + reachable * reachable) / (2 * reachable);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        return { x: hip.x + ux * along - uy * height, y: hip.y + uy * along + ux * height };
      }
    };
    /* CYCLING_MATH_END */

    const CFG = {
      wheelRadius: 0.685, gearRatio: 1.9, crankRadius: 0.27,
      crank: { x: -0.23, y: 0.72 }, rearX: -1.15, frontX: 1.15, wheelY: 0.695,
      upperLeg: 0.74, lowerLeg: 0.72
    };
    const palette = {
      feather: 0xf5f0df, featherLight: 0xfff9e9, featherShade: 0xdedcc9,
      orange: 0xe9944f, pouch: 0xefb46d, foot: 0xd98345,
      teal: 0x276a69, tealDark: 0x183f40, rubber: 0x233b3a,
      cream: 0xeee2bf, metal: 0xa9b6aa, brass: 0xc89652,
      coral: 0xcf684d, road: 0xbfb9a5, grass: 0x99a982
    };
    const container = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce7dd);
    scene.fog = new THREE.Fog(0xdce7dd, 24, 82);
    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 180);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.13;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 6.5;
    controls.maxDistance = 22;
    controls.minPolarAngle = Math.PI * 0.20;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.7;
    controls.target.set(0.1, 1.65, 0);

    const hemi = new THREE.HemisphereLight(0xeaf5ed, 0x9b967c, 2.25);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight(0xffe4bd, 3.2);
    sunLight.position.set(-4, 10, 7);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    Object.assign(sunLight.shadow.camera, { left: -7, right: 7, top: 7, bottom: -5, near: 0.5, far: 30 });
    sunLight.shadow.bias = -0.00025;
    sunLight.shadow.normalBias = 0.025;
    sunLight.shadow.radius = 4;
    scene.add(sunLight);
    const fill = new THREE.DirectionalLight(0xb5d9d3, 1.0);
    fill.position.set(5, 4, -6);
    scene.add(fill);

    const mat = (color, roughness = 0.75, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });
    const M = {
      feather: mat(palette.feather, 0.9), featherLight: mat(palette.featherLight, 0.88), featherShade: mat(palette.featherShade, 0.92),
      orange: mat(palette.orange, 0.66), pouch: mat(palette.pouch, 0.82), foot: mat(palette.foot, 0.8),
      teal: mat(palette.teal, 0.35, 0.35), tealDark: mat(palette.tealDark, 0.46, 0.2), rubber: mat(palette.rubber, 0.96),
      cream: mat(palette.cream, 0.78), metal: mat(palette.metal, 0.28, 0.78), brass: mat(palette.brass, 0.3, 0.65),
      coral: mat(palette.coral, 0.88), eye: new THREE.MeshPhysicalMaterial({ color: 0x142a28, roughness: 0.12, clearcoat: 1 }),
      eyeRim: mat(0xc79b59, 0.65), white: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      road: mat(palette.road, 1), grass: mat(palette.grass, 1), sand: mat(0xcac2a4, 1),
      wood: mat(0x8b8266, 0.94), stone: mat(0x9c9f8e, 1), leaf: mat(0x718b67, 0.95), leafLight: mat(0xafbb87, 0.95),
      cloud: mat(0xf5f1df, 1), island: mat(0x76968a, 1),
      light: new THREE.MeshStandardMaterial({ color: 0xffe2a1, emissive: 0xffc86a, emissiveIntensity: 0.65, roughness: 0.25 })
    };
    const unitSphere = new THREE.SphereGeometry(1, 28, 20);
    const lowSphere = new THREE.SphereGeometry(1, 12, 8);
    const Y_AXIS = new THREE.Vector3(0, 1, 0);
    const tempDir = new THREE.Vector3();

    function addMesh(parent, geometry, material, position, scale) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(...position);
      if (scale) object.scale.set(...scale);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }
    function ellipsoid(parent, material, position, scale, rotation) {
      const object = addMesh(parent, unitSphere, material, position, scale);
      if (rotation) object.rotation.set(...rotation);
      return object;
    }
    function box(parent, material, position, size) {
      return addMesh(parent, new THREE.BoxGeometry(...size), material, position);
    }
    function link(parent, material, a, b, radius, radiusTop = radius, sides = 12) {
      const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
      const object = addMesh(parent, new THREE.CylinderGeometry(radiusTop, radius, 1, sides), material);
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.scale.y = start.distanceTo(end);
      object.quaternion.setFromUnitVectors(Y_AXIS, end.sub(start).normalize());
      return object;
    }
    function makeBone(parent, material, radius, flatten = 1) {
      const object = addMesh(parent, unitSphere, material);
      object.userData.radius = radius;
      object.userData.flatten = flatten;
      return object;
    }
    function setBone(object, a, b, radiusScale = 1) {
      tempDir.subVectors(b, a);
      object.position.copy(a).add(b).multiplyScalar(0.5);
      object.scale.set(object.userData.radius * radiusScale, tempDir.length() * 0.59, object.userData.radius * object.userData.flatten * radiusScale);
      object.quaternion.setFromUnitVectors(Y_AXIS, tempDir.normalize());
    }
    function tube(parent, points, radius, material, closed = false, segments = 40) {
      const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), closed, 'centripetal');
      return addMesh(parent, new THREE.TubeGeometry(curve, segments, radius, 8, closed), material);
    }
    function torus(parent, radius, thickness, material, position, rotation) {
      const object = addMesh(parent, new THREE.TorusGeometry(radius, thickness, 10, 64), material, position);
      if (rotation) object.rotation.set(...rotation);
      return object;
    }
    function loftGeometry(sections, radialSegments = 20) {
      const vertices = [], indices = [];
      for (const s of sections) {
        for (let j = 0; j < radialSegments; j++) {
          const a = j / radialSegments * Math.PI * 2;
          vertices.push(s.x, s.y + Math.cos(a) * s.ry, Math.sin(a) * s.rz);
        }
      }
      for (let i = 0; i < sections.length - 1; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const n = (j + 1) % radialSegments, a = i * radialSegments + j, b = i * radialSegments + n;
          const c = (i + 1) * radialSegments + n, d = (i + 1) * radialSegments + j;
          indices.push(a, b, d, b, c, d);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }
    function wrap(value, min, max) {
      const range = max - min;
      return ((value - min) % range + range) % range + min;
    }

    // Coast and endlessly recycled roadside details.
    const moving = [];
    const swaying = [];
    const environment = new THREE.Group();
    scene.add(environment);
    const ground = addMesh(environment, new THREE.PlaneGeometry(180, 45), M.sand, [0, -0.10, 17]);
    ground.rotation.x = -Math.PI / 2;
    ground.castShadow = false;
    const road = addMesh(environment, new THREE.PlaneGeometry(180, 6.4), M.road, [0, -0.012, 0]);
    road.rotation.x = -Math.PI / 2;
    road.castShadow = false;
    const verge = addMesh(environment, new THREE.PlaneGeometry(180, 5.4), M.grass, [0, -0.035, 5.7]);
    verge.rotation.x = -Math.PI / 2;
    verge.castShadow = false;

    const waterTime = { value: 0 };
    const waterMaterial = new THREE.MeshStandardMaterial({ color: 0x70aaa4, roughness: 0.35, metalness: 0.08 });
    waterMaterial.onBeforeCompile = shader => {
      shader.uniforms.uTime = waterTime;
      shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;');
      shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
        vec3 transformed = vec3(position);
        transformed.z += sin(position.x * 0.34 + uTime * 0.8) * 0.075;
        transformed.z += sin(position.y * 0.58 - uTime * 0.55 + position.x * 0.13) * 0.045;
      `);
    };
    waterMaterial.customProgramCacheKey = () => 'pelican-water-v1';
    const water = addMesh(environment, new THREE.PlaneGeometry(180, 75, 100, 30), waterMaterial, [0, -0.28, -40]);
    water.rotation.x = -Math.PI / 2;
    water.castShadow = false;
    water.receiveShadow = false;

    for (let x = -60; x <= 60; x += 5) {
      for (const z of [-2.63, 2.63]) {
        const dash = box(environment, M.cream, [x, 0.005, z], [2.5, 0.018, 0.055]);
        dash.castShadow = false;
        moving.push({ object: dash, baseX: x, span: 125 });
      }
    }
    for (let x = -48; x <= 48; x += 4) {
      const post = new THREE.Group();
      post.position.set(x, 0, -3.55);
      environment.add(post);
      link(post, M.wood, [0, -0.03, 0], [0, 0.72, 0], 0.055, 0.045);
      ellipsoid(post, M.cream, [0, 0.74, 0], [0.065, 0.04, 0.065]);
      for (const y of [0.30, 0.58]) link(post, M.cream, [0, y, 0], [4, y - 0.035, 0], 0.017, 0.017, 7);
      moving.push({ object: post, baseX: x, span: 100 });
    }
    for (let i = 0; i < 48; i++) {
      const clump = new THREE.Group();
      const baseX = -48 + (i * 17.31) % 96;
      const side = i % 3 === 0 ? -1 : 1;
      clump.position.set(baseX, 0, side > 0 ? 3.5 + (i % 5) * 0.55 : -3.05 - (i % 3) * 0.18);
      clump.rotation.y = (i * 2.4) % Math.PI;
      environment.add(clump);
      for (let j = 0; j < 4; j++) {
        const h = 0.24 + ((i + j * 3) % 6) * 0.055;
        const blade = addMesh(clump, new THREE.ConeGeometry(0.036, h, 5), j % 2 ? M.leaf : M.leafLight, [(j - 1.5) * 0.075, h * 0.48, (j % 2) * 0.06]);
        blade.rotation.z = (j - 1.5) * 0.15;
        blade.castShadow = false;

            const wave=Math.sin(time*5.2-t*6+tail.phase)*.075*t;
            positions.setXYZ(i*tail.cols+j,
              -.31-t*tail.length,
              2.94+bob-.27*t+wave,
              tail.z+across*.19*(1-t*.3)+Math.sin(time*3.5-t*4+tail.phase)*.08*t
            );
          }
        }
        positions.needsUpdate=true;
        tail.object.geometry.computeVertexNormals();
      }
    }

        elbow.set(.02,2.06+bob*.45,side*.46);
        setBone(wing.upper,shoulder,elbow);
        setBone(wing.lower,elbow,grip,.9);
        const tipStart=new THREE.Vector3(.57,1.91,side*.45);
        setBone(wing.tip,tipStart,grip,.8);
        wing.feathers.forEach((feather,i)=>{
          const a=shoulder.clone().lerp(elbow,.25+i*.17);
          const b=a.clone().add(new THREE.Vector3(-.18-i*.025,-.22,side*.025));
          setBone(feather,a,b,1);
        });
      });
      updateScarf(time,bob);
      bellEnergy*=Math.exp(-.06);
      bell.rotation.z=Math.sin(time*38)*bellEnergy*.22;
    }
    function updateEnvironment(time) {
      moving.forEach(item=>item.object.position.x=wrap(item.baseX-distance,-item.span/2,item.span/2));
      swaying.forEach(item=>item.object.rotation.z=Math.sin(time*2.1+item.phase)*.045);
      clouds.forEach(item=>item.object.position.x=wrap(item.baseX-time*item.speed,-48,48));
      seaBirds.forEach((bird,i)=>{
        bird.object.position.x=wrap(-14+i*8+time*.28,-28,28);
        bird.object.position.y=5.7+(i%2)+Math.sin(time*.8+bird.phase)*.15;
        bird.object.rotation.z=Math.sin(time*2.2+bird.phase)*.08;
      });
      waterTime.value=time;
    }
    function animate() {
      requestAnimationFrame(animate);
      const dt=Math.min(clock.getDelta(),.04);
      elapsed+=dt;
      const desiredSpeed=paused?0:Number(speedInput.value);
      currentSpeed=THREE.MathUtils.damp(currentSpeed,desiredSpeed,3.0,dt);
      if(currentSpeed<.002 && desiredSpeed===0)currentSpeed=0;
      distance+=currentSpeed*dt;
      updateRider(elapsed);
      updateEnvironment(elapsed);
      if(cameraTween) {
        cameraTween.time=Math.min(cameraTween.time+dt/1.15,1);
        const t=cameraTween.time, ease=t*t*(3-2*t);
        camera.position.lerpVectors(cameraTween.from,cameraTween.to,ease);
        controls.target.lerpVectors(cameraTween.targetFrom,cameraTween.targetTo,ease);
        if(t===1)cameraTween=null;
      }
      controls.update();
      renderer.render(scene,camera);
    }
    moveCamera(0,true);
    updateSpeedUI();
    updateRider(0);
    updateEnvironment(0);
    renderer.render(scene,camera);
    window.__PELICAN_READY__=true;
    document.getElementById('loading').classList.add('done');
    animate();
  </script>
</body>
</html>

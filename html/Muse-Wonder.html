<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行 · Pelican Ride — Three.js 程序化 3D 场景</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87c5e8;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif; }
  #scene { position:fixed; inset:0; display:block; touch-action:none; }

  .panel {
    position:fixed; z-index:10; color:#12303c;
    background:rgba(255,255,255,.78); backdrop-filter:blur(14px) saturate(1.3);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid rgba(255,255,255,.65); border-radius:18px;
    box-shadow:0 12px 32px rgba(20,60,90,.18);
  }
  #info { top:18px; left:18px; padding:16px 20px 14px; max-width:340px; }
  #info h1 { font-size:22px; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  #info h1 .badge { font-size:11px; font-weight:600; color:#fff; background:linear-gradient(135deg,#ff9f2e,#ff6a3d);
    padding:3px 9px; border-radius:999px; letter-spacing:1px; }
  #info p { margin-top:7px; font-size:13px; line-height:1.65; color:#3c5a68; }
  #info .hint { margin-top:9px; font-size:12px; color:#6b8a97; line-height:1.7; }
  #info .hint b { color:#0e7c8c; font-weight:600; }

  #stats { top:18px; right:18px; padding:12px 18px; display:flex; gap:22px; text-align:center; }
  #stats .num { font-size:24px; font-weight:700; color:#0b6e7e; font-variant-numeric:tabular-nums; line-height:1.1; }
  #stats .lbl { font-size:11px; color:#6b8a97; letter-spacing:1px; margin-top:2px; }

  #bar { left:50%; bottom:20px; transform:translateX(-50%); padding:12px 16px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; max-width:94vw; }
  .btn { appearance:none; border:1px solid rgba(14,124,140,.25); background:rgba(255,255,255,.85);
    color:#0b5563; font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer;
    transition:all .18s ease; white-space:nowrap; }
  .btn:hover { background:#0e7c8c; color:#fff; transform:translateY(-1px); }
  .btn.active { background:#0e7c8c; color:#fff; box-shadow:0 4px 14px rgba(14,124,140,.35); }
  .btn.warn:hover { background:#ff7a3d; }
  .sep { width:1px; height:24px; background:rgba(14,60,80,.15); }
  .slider-wrap { display:flex; align-items:center; gap:9px; padding:0 4px; }
  .slider-wrap label { font-size:12px; color:#48626e; white-space:nowrap; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:130px; height:6px; border-radius:3px;
    background:linear-gradient(90deg,#0e7c8c var(--fill,45%),#cfe3ea var(--fill,45%)); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; border:3px solid #0e7c8c; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  #toast { position:fixed; z-index:20; left:50%; bottom:96px; transform:translate(-50%,16px); opacity:0;
    pointer-events:none; transition:all .35s ease; background:rgba(10,45,58,.88); color:#eaf7fb;
    font-size:14px; padding:10px 20px; border-radius:999px; box-shadow:0 10px 26px rgba(0,0,0,.25); }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:linear-gradient(180deg,#a5dcf5,#e8f7ff);
    color:#0b5563; font-size:15px; letter-spacing:2px; transition:opacity .6s ease; }
  #loading .spin { width:44px; height:44px; border-radius:50%; border:5px solid rgba(14,124,140,.2);
    border-top-color:#0e7c8c; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (max-width:760px){
    #info { max-width:calc(100vw - 36px); } #info p{ display:none; }
    #stats { top:auto; bottom:92px; right:12px; padding:8px 12px; gap:14px; } #stats .num{ font-size:18px; }
  }
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div>正在组装鹈鹕与自行车…</div></div>

<div class="panel" id="info">
  <h1>鹈鹕骑行 <span class="badge">THREE.JS</span></h1>
  <p>一只大白鹈鹕正蹬着自行车沿湖边小路骑行。身体、车架、车轮全部由代码程序化建模，双腿用双骨 IK 实时贴合旋转的脚踏，翅膀搭在车把上，脖子与喉囊随踏频自然起伏。</p>
  <div class="hint">
    🖱️ <b>拖动</b>旋转 · <b>滚轮</b>缩放 · <b>右键拖动</b>平移<br>
    👆 <b>点击鹈鹕</b>它会张嘴鸣叫 · 按 <b>空格</b>暂停 · <b>↑↓</b>调速
  </div>
</div>

<div class="panel" id="stats">
  <div><div class="num" id="st-speed">0.0</div><div class="lbl">KM/H 车速</div></div>
  <div><div class="num" id="st-rpm">55</div><div class="lbl">RPM 踏频</div></div>
  <div><div class="num" id="st-dist">0.00</div><div class="lbl">KM 里程</div></div>
</div>

<div class="panel" id="bar">
  <button class="btn" id="btn-pause">⏸ 暂停</button>
  <div class="slider-wrap">
    <label>踏频</label>
    <input type="range" id="speed" min="0" max="110" value="55" step="1">
    <label id="speed-val">55 RPM</label>
  </div>
  <div class="sep"></div>
  <button class="btn cam active" data-cam="orbit">🎥 自由视角</button>
  <button class="btn cam" data-cam="side">🚴 侧面跟拍</button>
  <button class="btn cam" data-cam="chase">🌅 追尾视角</button>
  <button class="btn cam" data-cam="close">🔍 鹈鹕特写</button>
  <div class="sep"></div>
  <button class="btn warn" id="btn-bell">🔔 按铃铛</button>
  <button class="btn" id="btn-day">🌙 夜幕</button>
</div>

<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   基础：渲染器 / 场景 / 摄像机 / 灯光
============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.id = 'scene';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c5e8);
scene.fog = new THREE.Fog(0x9fd0ea, 26, 78);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(3.1, 1.7, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.2;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.52;

const hemi = new THREE.HemisphereLight(0xcfeaff, 0x6fae5e, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.4);
sun.position.set(7, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;  sun.shadow.camera.bottom = -9;
sun.shadow.camera.far = 40; sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfe0ff, 0.5);
fill.position.set(-6, 4, -6);
scene.add(fill);

/* ============================================================
   材质与几何小工具
============================================================ */
const M = {
  feather : new THREE.MeshStandardMaterial({ color:0xf7f4ec, roughness:0.9,  metalness:0 }),
  feather2: new THREE.MeshStandardMaterial({ color:0xe9e2d2, roughness:0.95, metalness:0 }),
  darkTip : new THREE.MeshStandardMaterial({ color:0x2e3238, roughness:0.7,  metalness:0.05 }),
  beak    : new THREE.MeshStandardMaterial({ color:0xff9d2e, roughness:0.45, metalness:0.05 }),
  pouch   : new THREE.MeshStandardMaterial({ color:0xffbe78, roughness:0.65, metalness:0 }),
  legOrng : new THREE.MeshStandardMaterial({ color:0xff8b2a, roughness:0.6,  metalness:0 }),
  eye     : new THREE.MeshStandardMaterial({ color:0x14181c, roughness:0.25, metalness:0.2 }),
  eyeRing : new THREE.MeshStandardMaterial({ color:0xffc44d, roughness:0.5,  metalness:0 }),
  frame   : new THREE.MeshStandardMaterial({ color:0x0f9aa7, roughness:0.32, metalness:0.55 }),
  frame2  : new THREE.MeshStandardMaterial({ color:0x0b7a85, roughness:0.35, metalness:0.55 }),
  chrome  : new THREE.MeshStandardMaterial({ color:0xd9dee2, roughness:0.22, metalness:0.9 }),
  tire    : new THREE.MeshStandardMaterial({ color:0x23272b, roughness:0.92, metalness:0 }),
  rim     : new THREE.MeshStandardMaterial({ color:0xc8ced4, roughness:0.3,  metalness:0.85 }),
  saddle  : new THREE.MeshStandardMaterial({ color:0x7a4a26, roughness:0.75, metalness:0 }),
  grip    : new THREE.MeshStandardMaterial({ color:0x3a2c20, roughness:0.85, metalness:0 }),
  gold    : new THREE.MeshStandardMaterial({ color:0xffc93c, roughness:0.25, metalness:0.85 }),
  basket  : new THREE.MeshStandardMaterial({ color:0xb5854d, roughness:0.9,  metalness:0 }),
  road    : new THREE.MeshStandardMaterial({ color:0x4a4f55, roughness:0.98, metalness:0 }),
  roadLn  : new THREE.MeshStandardMaterial({ color:0xf5eeda, roughness:0.8,  metalness:0 }),
  grass   : new THREE.MeshStandardMaterial({ color:0x77bd63, roughness:1,    metalness:0 }),
  grass2  : new THREE.MeshStandardMaterial({ color:0x5da84e, roughness:1,    metalness:0 }),
  trunk   : new THREE.MeshStandardMaterial({ color:0x7b5233, roughness:0.95, metalness:0 }),
  leaf    : new THREE.MeshStandardMaterial({ color:0x3f9e4d, roughness:0.9,  metalness:0 }),
  leaf2   : new THREE.MeshStandardMaterial({ color:0x57b25e, roughness:0.9,  metalness:0 }),
  cloud   : new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1,    metalness:0, emissive:0x8899aa, emissiveIntensity:0.06 }),
  water   : new THREE.MeshStandardMaterial({ color:0x3f9fd8, roughness:0.25, metalness:0.35 }),
  hill    : new THREE.MeshStandardMaterial({ color:0x8fc98a, roughness:1,    metalness:0 }),
  rock    : new THREE.MeshStandardMaterial({ color:0x9aa0a4, roughness:0.95, metalness:0 }),
};

const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const UP = V3(0,1,0);

/** 单位圆柱：用 setLimb 摆到 a→b 之间（动态肢体反复复用） */
function limbMesh(radius, material){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,10), material);
  m.userData.r = radius; m.castShadow = true;
  return m;
}
const _dir = new THREE.Vector3(), _mid = new THREE.Vector3();
function setLimb(mesh, a, b, rTop, rBottom){
  _dir.subVectors(b, a);
  const len = Math.max(_dir.length(), 0.0001);
  _mid.addVectors(a, b).multiplyScalar(0.5);
  mesh.position.copy(_mid);
  mesh.scale.set(mesh.userData.r, len, mesh.userData.r);
  mesh.quaternion.setFromUnitVectors(UP, _dir.normalize());
  return mesh;
}
/** 静态管子：直接生成 a→b 的圆柱 */
function tube(a, b, r, material, seg=10){
  const dir = V3().subVectors(b, a), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), material);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  m.castShadow = true;
  return m;
}
function ball(r, material, sx=1, sy=1, sz=1){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), material);
  m.scale.set(sx, sy, sz); m.castShadow = true;
  return m;
}
function jointBall(r, material){
  const m = ball(r, material); return m;
}

/* ============================================================
   环境：地面 / 湖 / 路 / 远山 / 云 / 滚动景物
============================================================ */
const world = new THREE.Group(); scene.add(world);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), M.grass);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.receiveShadow = true;
world.add(ground);

const lake = new THREE.Mesh(new THREE.PlaneGeometry(240, 26), M.water);
lake.rotation.x = -Math.PI/2; lake.position.set(0, -0.005, -22); lake.receiveShadow = true;
world.add(lake);

const road = new THREE.Mesh(new THREE.PlaneGeometry(240, 3.4), M.road);
road.rotation.x = -Math.PI/2; road.position.y = 0.0; road.receiveShadow = true;
world.add(road);
const roadEdgeL = new THREE.Mesh(new THREE.PlaneGeometry(240, 0.09), M.roadLn);
roadEdgeL.rotation.x = -Math.PI/2; roadEdgeL.position.set(0, 0.006,  1.62); world.add(roadEdgeL);
const roadEdgeR = roadEdgeL.clone(); roadEdgeR.position.z = -1.62; world.add(roadEdgeR);

// 远山
for (const [x,z,s] of [[-38,-52,16],[6,-58,22],[44,-50,15],[-62,-44,12],[70,-46,18]]){
  const h = new THREE.Mesh(new THREE.ConeGeometry(s, s*0.52, 7), M.hill);
  h.position.set(x, s*0.22, z); world.add(h);
}
// 太阳（可视）与月亮
const sunBall = ball(1.15, new THREE.MeshBasicMaterial({ color:0xffe9a8, fog:false }), 1,1,1);
sunBall.castShadow = false; sunBall.position.set(26, 17, -30); scene.add(sunBall);
const moonBall = ball(0.8, new THREE.MeshBasicMaterial({ color:0xe8efff, fog:false }), 1,1,1);
moonBall.castShadow = false; moonBall.position.set(-22, 15, -28); moonBall.visible = false; scene.add(moonBall);
// 星星（夜晚显示，WebGL Points）
const starGeo = new THREE.BufferGeometry();
{
  const pts = [];
  for (let i=0;i<420;i++){
    const a = Math.random()*Math.PI*2, e = Math.random()*Math.PI*0.42+0.08, r = 110;
    pts.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.55, sizeAttenuation:true, transparent:true, opacity:0, fog:false }));
scene.add(stars);

// 云朵：球团组合，缓慢漂移
const clouds = [];
function makeCloud(x, y, z, s){
  const g = new THREE.Group();
  const n = 4 + Math.floor(Math.random()*3);
  for (let i=0;i<n;i++){
    const b = ball(0.55+Math.random()*0.5, M.cloud, 1.25, 0.62, 1);
    b.castShadow = false;
    b.position.set((i-(n-1)/2)*0.62, Math.random()*0.16, (Math.random()-0.5)*0.4);
    g.add(b);
  }
  g.position.set(x,y,z); g.scale.setScalar(s);
  scene.add(g); clouds.push(g); return g;
}
makeCloud(-14, 8.5, -18, 1.6); makeCloud(4, 10, -24, 2.1); makeCloud(18, 7.6, -14, 1.25);
makeCloud(-26, 11, -10, 1.8); makeCloud(30, 9.4, -22, 1.5); makeCloud(-4, 9, 16, 1.3);

// 滚动景物：虚线车道线 / 树 / 草丛 / 石头 / 栅栏（随车速向后流动并循环）
const scrollers = [];
function addScroller(obj, x){ obj.position.x = x; world.add(obj); scrollers.push(obj); return obj; }

for (let i=0;i<26;i++){
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 0.13), M.roadLn);
  dash.rotation.x = -Math.PI/2; dash.position.y = 0.008; dash.position.z = 0;
  addScroller(dash, -52 + i*4);
}
function makeTree(side){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, 0.85, 8), M.trunk);
  trunk.position.y = 0.42; trunk.castShadow = true; g.add(trunk);
  const lm = Math.random() > 0.5 ? M.leaf : M.leaf2;
  const c1 = ball(0.62, lm, 1, 1.12, 1); c1.position.y = 1.28; g.add(c1);
  const c2 = ball(0.44, lm, 1, 1, 1);     c2.position.set(0.36, 1.02, 0.12); g.add(c2);
  const c3 = ball(0.4, lm, 1, 1, 1);      c3.position.set(-0.34, 1.06, -0.1); g.add(c3);
  const s = 0.8 + Math.random()*0.75;
  g.scale.setScalar(s);
  g.position.z = side * (3.1 + Math.random()*3.4);
  g.position.y = 0;
  return g;
}
for (let i=0;i<22;i++){
  const side = i % 2 === 0 ? 1 : -1;
  addScroller(makeTree(side), -55 + i*5 + Math.random()*2.4);
}
for (let i=0;i<30;i++){
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.3, 6), Math.random()>0.5?M.grass2:M.leaf2);
  tuft.castShadow = true;
  const side = Math.random()>0.5?1:-1;
  tuft.position.set(0, 0.13, side*(2.1+Math.random()*2.6));
  addScroller(tuft, -55 + Math.random()*110);
}
for (let i=0;i<10;i++){
  const rock = ball(0.16+Math.random()*0.14, M.rock, 1, 0.72, 0.85);
  const side = Math.random()>0.5?1:-1;
  rock.position.set(0, 0.06, side*(2.3+Math.random()*3));
  addScroller(rock, -55 + Math.random()*110);
}
for (let i=0;i<16;i++){ // 湖侧木栅栏
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.55, 0.07), M.trunk);
  post.position.set(0, 0.27, -2.35); post.castShadow = true;
  addScroller(post, -55 + i*7);
}

/* ============================================================
   自行车：车架 / 车轮 / 传动 / 车把（关键点位定义全车坐标）
============================================================ */
const WHEEL_R = 0.34, GEAR = 2.4, CRANK_R = 0.165;
const REAR_AXLE  = V3(-0.54, WHEEL_R, 0);
const FRONT_AXLE = V3( 0.54, WHEEL_R, 0);
const BB         = V3(-0.06, 0.40, 0);          // 中轴（脚踏旋转中心）
const SEAT_TOP   = V3(-0.30, 0.80, 0);
const HEAD_TOP   = V3( 0.40, 0.86, 0);
const HEAD_BOT   = V3( 0.45, 0.62, 0);

const bike = new THREE.Group(); scene.add(bike);

function makeWheel(){
  const g = new THREE.Group();
  const spin = new THREE.Group(); g.add(spin);
  const tire = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R-0.025, 0.032, 14, 40), M.tire);
  tire.castShadow = true; spin.add(tire);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R-0.055, 0.011, 8, 40), M.rim);
  spin.add(rim);
  for (let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.0028, 0.0028, (WHEEL_R-0.06)*2, 4), M.rim);
    sp.rotation.z = a; spin.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.07, 12), M.chrome);
  hub.rotation.x = Math.PI/2; spin.add(hub);
  // 反光片
  const refl = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.03, 0.012),
    new THREE.MeshStandardMaterial({ color:0xff5533, roughness:0.4, emissive:0x661100, emissiveIntensity:0.4 }));
  refl.position.set(WHEEL_R-0.09, 0, 0.035); spin.add(refl);
  g.userData.spin = spin;
  return g;
}
const wheelRear = makeWheel();  wheelRear.position.copy(REAR_AXLE);  bike.add(wheelRear);
const wheelFrontPivot = new THREE.Group(); wheelFrontPivot.position.copy(FRONT_AXLE); bike.add(wheelFrontPivot);
const wheelFront = makeWheel(); wheelFrontPivot.add(wheelFront);

// 前叉 + 转向组（车把/前叉/前轮一起做小幅摆动，像真人扶把）
const steer = new THREE.Group(); steer.position.copy(HEAD_BOT); bike.add(steer);
// 车架管
bike.add(tube(REAR_AXLE, BB, 0.021, M.frame));                    // 后下叉
bike.add(tube(REAR_AXLE, V3(-0.27,0.74,0), 0.019, M.frame));      // 后上叉
bike.add(tube(BB, V3(-0.27,0.74,0), 0.026, M.frame));             // 座管
bike.add(tube(BB, HEAD_BOT, 0.027, M.frame));                     // 下管
bike.add(tube(V3(-0.27,0.74,0), HEAD_TOP, 0.026, M.frame));       // 上管

/* ============================================================
   双骨 IK：在 XY 平面解算，膝/肘朝行进方向（+X）弯曲
============================================================ */
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _d = new THREE.Vector3(), _perp = new THREE.Vector3();
function solveKnee(hip, target, L1, L2, out, bendSign=1){
  _d.subVectors(target, hip);
  let dist = _d.length();
  const maxD = (L1 + L2) * 0.999;
  if (dist > maxD){ _d.multiplyScalar(maxD/dist); dist = maxD; target = _a.copy(hip).add(_d); }
  if (dist < Math.abs(L1-L2)+0.01) dist = Math.abs(L1-L2)+0.01;
  _d.normalize();
  const aLen = (L1*L1 - L2*L2 + dist*dist) / (2*dist);
  const h = Math.sqrt(Math.max(L1*L1 - aLen*aLen, 0));
  _perp.set(-_d.y, _d.x, 0).multiplyScalar(bendSign); // XY 平面内垂线 → 膝盖向前
  out.copy(hip).addScaledVector(_d, aLen).addScaledVector(_perp, h);
  out.z = THREE.MathUtils.lerp(hip.z, target.z, 0.45);
  return out;
}

// 铃铛：WebAudio 清脆两声 + 铃铛摆动 + 鹈鹕应声回头
let audioCtx = null;
function ding(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    [5232, 4186].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f * 0.32;
      g.gain.setValueAtTime(0.0001, t0 + i*0.13);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + i*0.13 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i*0.13 + 0.55);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + i*0.13); o.stop(t0 + i*0.13 + 0.6);
    });
  } catch(e) { /* 无音频环境时静默 */ }
}

/* ============================================================
   动画主循环：踏频 → 曲柄 → 车轮 / 双腿 IK / 身体律动 / 世界流动
============================================================ */
const clock = new THREE.Clock();
const hipL = V3(), hipR = V3(), pedL = V3(), pedR = V3(), gripL = V3(), gripR = V3(), shoL = V3(), shoR = V3();
const neckTmp = V3(), headTarget = V3();
let wheelAngle = 0, statTimer = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const now = perfNow();

  // —— 昼夜插值 ——
  state.dayMix += (state.dayTarget - state.dayMix) * Math.min(dt*2.2, 1);
  const dm = state.dayMix;
  scene.background.lerpColors(nightCfg.sky, dayCfg.sky, dm);
  scene.fog.color.lerpColors(nightCfg.fog, dayCfg.fog, dm);
  sun.intensity = THREE.MathUtils.lerp(nightCfg.sun, dayCfg.sun, dm);
  sun.color.lerpColors(nightCfg.sunCol, dayCfg.sunCol, dm);
  hemi.intensity = THREE.MathUtils.lerp(nightCfg.hemi, dayCfg.hemi, dm);
  renderer.toneMappingExposure = THREE.MathUtils.lerp(nightCfg.exposure, dayCfg.exposure, dm);
  stars.material.opacity = (1-dm) * 0.95;
  sunBall.visible = dm > 0.25; moonBall.visible = dm <= 0.75;
  headLamp.intensity = (1-dm) * 55;
  lampBulb.material.emissive.setHex(dm < 0.5 ? 0xffcc66 : 0x000000);

  // —— 运动学主链：踏频驱动一切 ——
  const rpm = state.paused ? 0 : state.rpm;
  const crankSpeed = rpm * Math.PI * 2 / 60;               // rad/s
  state.crank += crankSpeed * dt;
  const crank = state.crank;
  wheelAngle += crankSpeed * GEAR * dt;
  const groundSpeed = crankSpeed * GEAR * WHEEL_R;         // m/s
  state.distKm += groundSpeed * dt / 1000;

  wheelRear.userData.spin.rotation.z  = -wheelAngle;
  wheelFront.userData.spin.rotation.z = -wheelAngle;

  // 转向小幅自摆（扶把微调）+ 铃铛余震
  const bellAge = now - state.bellT;
  const bellShake = bellAge < 0.7 ? Math.sin(bellAge*70) * 0.25 * (1 - bellAge/0.7) : 0;
  steer.rotation.y = Math.sin(crank * 0.5) * 0.018 + Math.sin(t * 0.7) * 0.008;
  wheelFrontPivot.rotation.y = steer.rotation.y;
  bell.rotation.z = bellShake;
  basket.rotation.z = Math.sin(crank * 2) * 0.012;

  // 脚踏位置（左右相差 180°）
  pedR.set(BB.x + Math.cos(crank) * CRANK_R, BB.y - Math.sin(crank) * CRANK_R,  0.155);
  pedL.set(BB.x - Math.cos(crank) * CRANK_R, BB.y + Math.sin(crank) * CRANK_R, -0.155);
  const bbR = BB.clone(); bbR.z =  0.05; const bbL = BB.clone(); bbL.z = -0.05;
  setLimb(crankArmR, bbR, pedR.clone().setZ(0.10));
  setLimb(crankArmL, bbL, pedL.clone().setZ(-0.10));
  crankArmR.scale.x = crankArmR.scale.z = 0.013;
  crankArmL.scale.x = crankArmL.scale.z = 0.013;
  pedalR.position.copy(pedR); pedalL.position.copy(pedL);
  chainring.rotation.z = -crank; cog.rotation.z = -wheelAngle;

  // 身体律动：每转一圈起伏两次 + 左右轻晃 + 前倾呼吸
  const bob = Math.sin(crank * 2) * 0.013 * Math.min(rpm/40, 1) + Math.sin(t * 1.6) * 0.0022;
  bird.position.y = bob;
  bird.rotation.x = Math.sin(crank) * 0.016;
  bird.rotation.z = -0.012 + Math.sin(crank * 2 + 0.6) * 0.006;
  tail.rotation.x = Math.sin(crank * 2 + 1.2) * 0.05;

  // —— 双腿 IK：髋（随 bob）→ 膝 → 脚踏 ——
  hipR.set(HIP_X, HIP_Y + bob,  HIP_Z); hipL.set(HIP_X, HIP_Y + bob, -HIP_Z);
  solveKnee(hipR, pedR, THIGH, SHIN, kneePosR, 1);
  solveKnee(hipL, pedL, THIGH, SHIN, kneePosL, 1);
  setLimb(thighR, hipR, kneePosR); setLimb(shinR, kneePosR, pedR);
  setLimb(thighL, hipL, kneePosL); setLimb(shinL, kneePosL, pedL);
  kneeR.position.copy(kneePosR); kneeL.position.copy(kneePosL);
  footR.position.copy(pedR).add(V3(0.012, 0.022, 0)); footR.rotation.z = Math.sin(crank) * 0.14 - 0.05;
  footL.position.copy(pedL).add(V3(0.012, 0.022, 0)); footL.rotation.z = Math.sin(crank + Math.PI) * 0.14 - 0.05;

  // —— 翅膀 IK：肩 → 肘（向后弯）→ 车把握点 ——
  gripR.set(GRIP_X - 0.02, GRIP_Y + bob * 0.25,  GRIP_Z);
  gripL.set(GRIP_X - 0.02, GRIP_Y + bob * 0.25, -GRIP_Z);
  shoR.set(SHOULDER.x, SHOULDER.y + bob,  SHOULDER.z);
  shoL.set(SHOULDER.x, SHOULDER.y + bob, -SHOULDER.z);
  solveKnee(shoR, gripR, WING_U, WING_F, elbowPosR, -1);
  solveKnee(shoL, gripL, WING_U, WING_F, elbowPosL, -1);
  elbowPosR.z = Math.max(elbowPosR.z, 0.16); elbowPosL.z = Math.min(elbowPosL.z, -0.16);
  setLimb(wingUpperR, shoR, elbowPosR); setLimb(wingForeR, elbowPosR, gripR);
  setLimb(wingUpperL, shoL, elbowPosL); setLimb(wingForeL, elbowPosL, gripL);
  elbowR.position.copy(elbowPosR); elbowL.position.copy(elbowPosL);
  wingTipR.position.copy(gripR); wingTipR.rotation.y = 0.2; wingTipR.rotation.z = -0.2 + Math.sin(crank*2)*0.03;
  wingTipL.position.copy(gripL); wingTipL.rotation.y = -0.2; wingTipL.rotation.z = -0.2 + Math.sin(crank*2 + 1)*0.03;

  // —— 脖子与头：贝塞尔链随 bob/踏频摆动，鸣叫时后仰 ——
  const honkAge = now - state.honkT;
  const honkLift = honkAge < 1.1 ? Math.sin(Math.min(honkAge/1.1, 1) * Math.PI) : 0;
  neckP2.y = 1.40 + Math.sin(crank * 2 + 0.9) * 0.008 + Math.sin(t * 1.3) * 0.004;
  neckP3.set(0.44 + Math.sin(t * 0.9) * 0.006, 1.47 + Math.sin(crank * 2 + 1.4) * 0.007 + honkLift * 0.05, Math.sin(crank) * 0.006);
  neckP0.y = 1.08;
  for (let i=0;i<NECK_N;i++){
    cubic(neckP0, neckP1, neckP2, neckP3, i/(NECK_N-1), neckTmp);
    neckBalls[i].position.copy(neckTmp);
  }
  headG.position.copy(neckP3).add(V3(0.035, 0.028, 0));
  headG.rotation.z = -0.10 + Math.sin(crank * 2 + 1.6) * 0.03 - honkLift * 0.28;
  headG.rotation.y = Math.sin(t * 0.55) * 0.10 + (bellAge < 1.4 ? Math.sin(Math.min(bellAge/1.4,1)*Math.PI) * 0.35 : 0);
  headG.rotation.x = Math.sin(crank) * 0.012;

  // 喉囊：弹簧开合 + 骑行晃动
  state.jawVel += (-state.jaw * 90 - state.jawVel * 7) * dt;
  state.jaw = THREE.MathUtils.clamp(state.jaw + state.jawVel * dt, 0, 0.62);
  beakLower.rotation.z = -state.jaw * 0.55;
  const pouchSwing = 1 + Math.sin(crank * 2 + 0.4) * 0.05 + state.jaw * 0.35;
  pouch.scale.set(1.32, 0.44 * pouchSwing, 0.44 * (2 - pouchSwing) * 0.9 + 0.05);

  // —— 世界流动：景物按地面速度后移并循环 ——
  if (groundSpeed > 0.001){
    const dx = groundSpeed * dt;
    for (const o of scrollers){
      o.position.x -= dx;
      if (o.position.x < -58) o.position.x += 116;
    }
  }
  lake.position.x = Math.sin(t * 0.24) * 0.4;
  for (const c of clouds){
    c.position.x -= dt * (0.12 + groundSpeed * 0.03);
    if (c.position.x < -46) c.position.x = 46;
  }
  waterPulse(t);

  // —— 摄像机预设动画 ——
  if (camAnim){
    camAnim.k = Math.min(camAnim.k + dt * 1.6, 1);
    const e = 1 - Math.pow(1 - camAnim.k, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.k >= 1) camAnim = null;
  } else if (state.camMode === 'side' || state.camMode === 'chase'){
    // 跟拍模式下目标缓缓回正（轻微手持感）
    controls.target.x += (0 - controls.target.x) * dt * 0.8;
  }

  // —— HUD ——
  statTimer += dt;
  if (statTimer > 0.12){
    statTimer = 0;
    $('st-speed').textContent = (groundSpeed * 3.6).toFixed(1);
    $('st-rpm').textContent = Math.round(rpm);
    $('st-dist').textContent = state.distKm.toFixed(2);
  }

  controls.update();
  renderer.render(scene, camera);
}
const _wp = { k: 0 };
function waterPulse(t){ M.water.roughness = 0.22 + Math.sin(t * 0.8) * 0.05; }

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
requestAnimationFrame(() => {
  const l = document.getElementById('loading');
  l.style.opacity = '0'; setTimeout(() => l.remove(), 650);
  setTimeout(() => toast('鹈鹕出发啦！拖动鼠标环顾四周，点它试试 👆'), 500);
});
</script>
</body>
</html>
